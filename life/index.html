<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a bank passbook (存摺) — sticky balance header, ledger rows, stamp-red for gains (台股慣例：紅漲綠跌) */
:root{
  --paper:#eaf1ee; --card:#fbfdfc; --ink:#12302b; --muted:#5a716c; --line:#cddbd6;
  --accent:#0f5e57; --accent-ink:#ffffff; --up:#c0281f; --down:#1b7a43; --warn:#a86400; --soft:#dcebe6; --glass:#bcd6e0; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --skin:#f1c9a5; --hair:#3b2a20;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1716; --card:#15201e; --ink:#e2eeea; --muted:#8fa49f; --line:#283a36;
  --accent:#5cc0b2; --accent-ink:#0b1514; --up:#ff6a5c; --down:#4cc37b; --warn:#e8a547; --soft:#1c2c29; --glass:#4a6670; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --skin:#d9a982; --hair:#1a120c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1716; --card:#15201e; --ink:#e2eeea; --muted:#8fa49f; --line:#283a36;
  --accent:#5cc0b2; --accent-ink:#0b1514; --up:#ff6a5c; --down:#4cc37b; --warn:#e8a547; --soft:#1c2c29; --glass:#4a6670; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --skin:#d9a982; --hair:#1a120c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.buy{color:var(--up);border-color:var(--up)} button.sell{color:var(--down);border-color:var(--down)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 10px;border-bottom:2px solid var(--ink)}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.nw{font-family:var(--f-num);font-size:clamp(26px,7vw,36px);font-weight:600;line-height:1.1}
.hbtns{display:flex;gap:8px}
.sub{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:6px}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav button{border:none;background:none;padding:6px 10px;border-radius:0;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}

section{margin-top:18px;display:grid;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font-size:18px;margin-bottom:10px}
.ledger{width:100%;border-collapse:collapse}
.ledger td{padding:7px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.ledger td:last-child{text-align:right}
.ledger tr.total td{border-bottom:none;border-top:2px solid var(--ink);font-weight:700;padding-top:9px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card);display:grid;gap:8px;min-width:0}
.item .t{font-weight:700}
.item .meta{font-size:13px;color:var(--muted)}
.item .price{font-family:var(--f-num);font-size:20px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);letter-spacing:.04em}
.chip.est{color:var(--warn)}
.chart{width:100%;height:auto;display:block}
.log li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;list-style:none}
.log{padding:0;margin:0;max-height:420px;overflow:auto}
.stamp{display:inline-block;border:2px solid var(--up);color:var(--up);font-family:var(--f-display);font-weight:900;padding:2px 10px;transform:rotate(-4deg);border-radius:4px;font-size:14px}
.field{display:grid;gap:4px} .field label{font-size:13px;color:var(--muted)}
.setup{max-width:440px;margin:40px auto;display:grid;gap:14px}
.setup h1{font-size:30px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
.note{font-size:12px;color:var(--muted)}
.trade{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
.qbtns{display:flex;gap:4px;flex-wrap:wrap}
.qbtns button{padding:4px 8px;font-size:12px}
.cat[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lock{display:grid;gap:6px;padding:10px;border:1px dashed var(--warn);border-radius:8px;font-size:13px;color:var(--muted)}
.lock b{color:var(--warn)}
.jump{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.flash{animation:fl .6s}@keyframes fl{from{background:var(--soft)}to{background:transparent}}}
.link{border:none;background:none;padding:0 4px;color:var(--accent);text-decoration:underline;font-size:13px}
.budget{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center}
.brow label{font-size:14px}
.brow.total{border-top:2px solid var(--ink);padding-top:8px;font-weight:700}
.brow.total b{text-align:right}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grid3 button{text-align:left;line-height:1.5}
.h3{font-size:16px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.fam{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.fam .meta{font-size:13px;color:var(--muted);min-width:0}
.carpic{width:100%;max-width:260px;height:auto;display:block;margin:0 auto;background:var(--soft);border-radius:8px}
.swatches{gap:6px}
.swatch{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
@media (max-width:420px){.brow{grid-template-columns:1fr 110px}}
.decide{margin-top:14px;background:var(--card);border:2px solid var(--warn);border-radius:10px;padding:16px;display:grid;gap:10px}
.decide h2{font-size:20px}
.decide p{margin:0}
.usebox{display:grid;gap:8px;padding:10px;background:var(--soft);border-radius:8px}
a.photo{color:var(--accent);font-size:13px;text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin:6px 0 10px}
.stat{display:grid;grid-template-columns:3em 1fr 2.2em;gap:8px;align-items:center;font-size:13px}
.stat b{text-align:right}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:3px}
.cell{position:relative;aspect-ratio:1;max-width:100%;border-radius:4px;background:color-mix(in srgb,var(--accent) calc(var(--h)*100%),var(--soft));display:flex;align-items:flex-end;padding:2px 3px;font-size:10px;color:var(--ink)}
.cell span{background:var(--card);border-radius:3px;padding:0 2px;opacity:.85}
.cell i{position:absolute;top:1px;right:3px;font-style:normal;color:var(--warn);font-size:12px}
textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;resize:vertical}
details.kid{border-bottom:1px dashed var(--line);padding:6px 0}
details.kid summary{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;cursor:pointer;list-style:none}
details.kid summary::-webkit-details-marker{display:none}
details.kid summary .meta{font-size:13px;color:var(--muted)}
details.kid .budget{margin-top:10px}
.log li{display:flex;gap:8px;align-items:flex-start}
.starb{border:none;background:none;padding:0 2px;font-size:16px;color:var(--muted);line-height:1.4}
.starb[aria-pressed="true"]{color:var(--warn)}
.ending{max-width:640px;margin:24px auto;display:grid;gap:14px}
.ending h1{font-size:30px}
.cause{font-family:var(--f-display);font-size:18px;margin:0;color:var(--muted)}
#bspeed{width:auto;padding:8px 6px}
.hbtns{flex-wrap:wrap}
.grid3 button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button[aria-pressed="true"],.cat[aria-pressed="true"],.grid3 button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:none}
button[aria-pressed="true"] .note{color:var(--paper);opacity:.8}
.swatch[aria-pressed="true"]{background-clip:padding-box}
.starb[aria-pressed="true"]{background:none;color:var(--warn)}
.focusbar{margin:4px 0 6px}
.recap{border-color:var(--accent);border-width:2px}
.ach{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;border:1px dashed var(--line);color:var(--muted);display:inline-flex;gap:6px;align-items:baseline}
.badge.on{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--soft);font-weight:700}
.badge small{font-weight:400;color:var(--muted)}
.pk{font-size:12px}
.scene{width:100%;height:auto;display:block;margin:4px 0 8px;max-height:170px}
.alloc{display:flex;gap:2px;height:16px;border-radius:4px;overflow:hidden;margin:6px 0}
.alloc i{display:block;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend>span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hbars{display:grid;gap:6px}
.hb{display:grid;grid-template-columns:6.5em 1fr 4.8em;gap:8px;align-items:center;font-size:13px}
.hb div{height:10px;background:var(--soft);border-radius:4px}
.hb i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hb b{text-align:right;font-weight:600}
.spark{width:100%;height:44px;display:block}
.hrowi{gap:10px;flex-wrap:nowrap;align-items:center}
.hicon{flex:none}
button:active:not(:disabled):not(.swatch):not(.starb):not(.link){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lifeset summary{cursor:pointer;list-style:none}
.lifeset summary::-webkit-details-marker{display:none}
.lifeset[open] summary{margin-bottom:12px}
.lifeset .brow{grid-template-columns:1fr 150px}
.spendcard{display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:10px}
.spendcard.planned{border:2px solid var(--ink)}
.spendcard>button{text-align:left;flex:1}
.spendcard{align-content:start}
.spendcard select{padding:6px 8px;font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.partner{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--soft);margin-bottom:10px}
.cands{display:grid;gap:8px;margin-top:10px}
.cand{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px}
.gigbox{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--soft);margin:10px 0}
.chip.live{background:var(--accent);color:var(--accent-ink)}
</style>
</head>

function incomeTax(){
  const gross=(S.retired?(S.gig||0)*12:S.salary*13.5)+(S.married?S.spouse*13.5:0);if(gross<=0)return 0;
  const people=1+(S.married?1:0)+S.kids.filter(k=>kidAge(k)<20).length;
  const ded=P(101000)*people+P(136000)*(S.married?2:1)+P(227000)*(S.married?2:1)+P(150000)*S.kids.filter(k=>kidAge(k)<6).length;
  let ti=Math.max(0,gross-ded),tax=0;const br=[[610000,.05],[1380000,.12],[2770000,.2],[5180000,.3],[Infinity,.4]];let prev=0;
  for(const [cap,r] of br){const c=P(cap);if(ti>prev){tax+=(Math.min(ti,c)-prev)*r}prev=c}
  return Math.round(tax);
}

function pensionCalc(){const yrs=Math.max(1,(S.retired&&S.retAge?S.retAge:age())-23);return Math.round(Math.min(S.salary,45800*S.pl)*yrs*.0155)}

function passive(){const f=flow();const div=divYear()/12;return {div,rent:f.rental,int:f.interest,pen:f.pension,fil:f.filial,gig:f.gig-f.gigNhi,total:div+f.rental+f.interest+f.pension+f.filial+f.gig-f.gigNhi}}

  const cover=need>0?pa.total/need:1,gap=Math.max(0,need-pa.total);
  const yieldNow=stockValue()>0?divYear()/stockValue():.05,y=Math.max(.03,Math.min(.07,yieldNow||.05));
  const needInvest=gap*12/y;
  // 不足的部分用現金＋股票撐幾年（考慮通膨 2%）
  let pool=Math.max(0,S.cash)+stockValue(),yrs=0,g=gap*12;while(g>0&&pool>0&&yrs<80){pool=pool*1.03-g;g*=1.02;yrs++}
  return {need,pa,cover,gap,needInvest,y,yrs:g<=0?Infinity:yrs}}

function autoSellForCash(){const target=Math.max(0,(flow().out-flow().inc))*3;let need=target-S.cash;if(need<=0)return;
  const hs=Object.entries(S.hold).sort((a,b)=>(asset(a[0]).dy||0)-(asset(b[0]).dy||0));const sold=[];
  for(const [id,h] of hs){if(need<=0)break;const a=asset(id),per=S.prices[id]*(1-(a.fee??BUY_FEE)-a.tax);const unit=a.type==="台股"||a.type==="ETF"?1:.001;
    let q=Math.min(h.qty,Math.ceil(need/per/unit)*unit);q=+q.toFixed(3);if(q<=0)continue;const get=q*per;const c=h.cost*q/h.qty;h.cost-=c;h.qty=+(h.qty-q).toFixed(3);if(h.qty<=0)delete S.hold[id];
    S.cash+=get;need-=get;sold.push(`${a.name} ${fmt(q)} 單位`)}
  if(sold.length)addLog(`退休金不夠用，自動賣出 ${sold.join("、")}，補足生活費`,"down")}
function forceSell(){const limit=Math.max(P(500000),(S.salary+(S.married?S.spouse:0))*12);if(S.cash>=-limit)return;
  for(const [id,h] of Object.entries(S.hold)){if(S.cash>=0)break;const a=asset(id),get=h.qty*S.prices[id]*(1-(a.fee??BUY_FEE)-a.tax);S.cash+=get;delete S.hold[id];addLog(`信貸額度爆了，被迫賣出全部 ${a.name}，拿回 ${money(get)}`,"down",true)}
  const order=[...S.houses].sort((x,y)=>(x.use==="self")-(y.use==="self"));
  for(const h of order){if(S.cash>=-limit*.2)break;const v=hv(h),get=Math.round(v*.9)-h.loan;S.cash+=get;S.houses.splice(S.houses.indexOf(h),1);
    addLog(`繳不出錢，銀行催收，被迫低價賣掉 ${listing(h.lid).name}（賣 ${money(v*.9)}，還完貸款拿回 ${money(get)}）`,"down",true);bump({happy:-15})}
  for(const c of [...S.cars]){if(S.cash>=-limit*.2)break;S.cash+=c.value-(c.loan||0);S.cars.splice(S.cars.indexOf(c),1);addLog(`被迫賣掉 ${carOf(c).name}`,"down")}
}
const ACH=[["m100","存到第一個 100 萬",()=>netWorth()>=1e6],["m1000","淨資產破千萬",()=>netWorth()>=1e7],["m5000","淨資產破五千萬",()=>netWorth()>=5e7],["b1","淨資產破億",()=>netWorth()>=1e8],

function divYear(){return Object.entries(S.hold).reduce((s,[id,h])=>{const a=asset(id);return s+h.qty*S.prices[id]*(a.dy||0)*(a.type==="美股"?.7:1)},0)}
function checkAch(){S.ach=S.ach||{};ACH.forEach(([k,n,f])=>{if(!S.ach[k]&&f()){S.ach[k]=tNow();addLog(`【成就解鎖】${n}`,"up",true)}})}
function mortality(){const a=age();const q=Math.min(.6,.00006*Math.exp(.087*a))*(1.6-S.st.health/100*1.2);return 1-Math.pow(1-q,1/12)}

function chartSVG(){
  const H=S.history,W=640,Ht=220,p={l:76,r:12,t:12,b:26};
  if(H.length<2)return `<p class="muted">按「下個月」開始過日子，這裡會畫出你的淨資產曲線。</p>`;
  const vals=H.map(h=>h.nw);let lo=Math.min(...vals,0),hi=Math.max(...vals);if(hi===lo)hi=lo+1;
  const x=i=>p.l+i*(W-p.l-p.r)/(H.length-1),y=v=>p.t+(hi-v)*(Ht-p.t-p.b)/(hi-lo);
  const pts=H.map((h,i)=>`${x(i).toFixed(1)},${y(h.nw).toFixed(1)}`).join(" ");
  const ticks=[0,1,2,3].map(k=>lo+(hi-lo)*k/3);
  const last=H[H.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="淨資產走勢">
    ${ticks.map(v=>`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${p.l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${money(v)}</text>`).join("")}
    ${lo<0?`<line x1="${p.l}" x2="${W-p.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="4 3"/>`:""}
    <polygon points="${p.l},${y(Math.max(lo,0))} ${pts} ${x(H.length-1)},${y(Math.max(lo,0))}" fill="var(--accent)" fill-opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(H.length-1)}" cy="${y(last.nw)}" r="4.5" fill="var(--accent)"/>
    <text x="${p.l}" y="${Ht-6}" font-size="11" fill="var(--muted)">${H[0].t}</text>
    <text x="${W-p.r}" y="${Ht-6}" font-size="11" fill="var(--muted)" text-anchor="end">${last.t}</text></svg>`;
}

    <div class="field"><label for="s-house">房子</label><select id="s-house"><option value="">沒有，租房子住</option>${Object.keys(CITIES).map(c=>`<optgroup label="${c}">${HOUSES.filter(h=>h.city===c).map(h=>`<option value="${h.id}">${h.name}（${h.ping} 坪）</option>`).join("")}</optgroup>`).join("")}</select></div>
    <div id="r-house" hidden class="budget">
      <div class="brow"><label for="s-hv">房子現在值多少（留空 = 依當時行情）</label><input id="s-hv" type="number" min="0" step="100000" placeholder="依行情"></div>
      <div class="brow"><label for="s-hl">房貸還剩多少</label><input id="s-hl" type="number" min="0" step="100000" value="0"></div>
      <div class="brow"><label for="s-hy">房貸還要繳幾年</label><input id="s-hy" type="number" min="1" max="40" value="20"></div>
      <div class="brow"><label for="s-huse">這間房子</label><select id="s-huse"><option value="self">自己住</option><option value="rent">已經租給別人</option></select></div></div>
    <div class="field"><label for="s-car">車子</label><select id="s-car"><option value="">沒有</option>${["機車","國產車","進口車","豪華車","超跑名車","商用車"].map(tp=>`<optgroup label="${tp}">${CARS.filter(c=>c.type===tp).map(c=>`<option value="${c.id}">${c.name}</option>`).join("")}</optgroup>`).join("")}</select></div>
    <div id="r-car" hidden class="budget">
      <div class="brow"><label for="s-cv">車子現在值多少（留空 = 新車價 6 成）</label><input id="s-cv" type="number" min="0" step="10000" placeholder="新車價 6 成"></div>
      <div class="brow"><label for="s-cl">車貸還剩多少</label><input id="s-cl" type="number" min="0" step="10000" value="0"></div>
      <div class="brow"><label for="s-cm">車貸還剩幾個月</label><input id="s-cm" type="number" min="1" max="96" value="36"></div></div>
    <div class="brow"><label for="s-pet">毛小孩</label><select id="s-pet"><option value="">沒有</option><option>狗</option><option>貓</option></select></div>
    <div class="brow" id="r-pet" hidden><label for="s-pn">毛小孩的名字</label><input id="s-pn" maxlength="12" placeholder="取個名字"></div>
    <p class="note">金額請用開始那一年的物價填。已婚、有小孩、有房有車的話，每個月的支出會自動算進去；生活費、房租可以照實際情況調整。</p></div></details>
  <button class="primary" id="s-go">開始人生</button>
  ${L.length?`<div class="panel"><h2>前世紀錄</h2>${pastList(L)}</div>`:""}</div>`}
let setupBg="",setupOpen=false;
function bindSetup(){
  const hint=()=>{const t=+document.getElementById("s-y").value*12+ +document.getElementById("s-m").value-1;
    document.getElementById("s-hint").textContent=t<NOW_T?"回到過去：用當時的股價、房價、車價開局，照真實歷史走到 2026 年 10 月，之後改成隨機模擬。":
      t>NOW_T?"未來試算：用今天的真實價格，乘上你設定的通膨率推算到那個月份開局。":"從現在開始：用 2026 年 10 月的真實價格開局。"};
  document.getElementById("s-y").onchange=hint;document.getElementById("s-m").onchange=hint;hint();
  const tog=()=>{document.getElementById("r-sp").hidden=document.getElementById("s-mar").value!=="married";document.getElementById("r-house").hidden=!document.getElementById("s-house").value;
    document.getElementById("r-car").hidden=!document.getElementById("s-car").value;document.getElementById("r-pet").hidden=!document.getElementById("s-pet").value};
  ["s-mar","s-house","s-car","s-pet"].forEach(id=>document.getElementById(id).onchange=tog);tog();
  document.getElementById("s-age").onchange=()=>{if(+document.getElementById("s-age").value>=30)document.querySelector(".lifeset").open=true};
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-p]").forEach(x=>x.setAttribute("aria-pressed",x===b));const [c,s]=b.dataset.p.split(",");document.getElementById("s-cash").value=c;document.getElementById("s-sal").value=s;setupBg=""});
  document.getElementById("s-rand").onclick=()=>{const [bg,[c0,c1],[s0,s1]]=pick(BGS);const a=Math.round(rr(22,32));
    document.getElementById("s-age").value=a;document.getElementById("s-cash").value=Math.round(rr(c0,c1)/1000)*1000;document.getElementById("s-sal").value=Math.round(rr(s0,s1)/500)*500;
    document.getElementById("s-exp").value=Math.round(rr(14000,24000)/500)*500;document.getElementById("s-rent").value=Math.round(rr(7000,18000)/500)*500;
    const y=Math.round(rr(2011,2035));document.getElementById("s-y").value=y;document.getElementById("s-m").value=Math.ceil(rr(0,12))||1;hint();
    setupBg=bg;document.getElementById("s-bg").textContent=`${a} 歲，${bg}。從 ${y} 年開始。`};
  document.getElementById("s-go").onclick=()=>{const v=id=>Math.max(0,+document.getElementById(id).value||0);
    newGame({bg:setupBg,age:Math.min(80,Math.max(15,v("s-age")||25)),infl:(+document.getElementById("s-inf").value||0)/100,name:document.getElementById("s-name").value.trim(),y:+document.getElementById("s-y").value,m:+document.getElementById("s-m").value,
      cash:+document.getElementById("s-cash").value||0,salary:v("s-sal"),expense:v("s-exp"),rent:v("s-rent"),
      life:(()=>{const g=id=>document.getElementById(id).value,n=id=>Math.max(0,+g(id)||0);
        return {mar:g("s-mar"),sp:n("s-sp"),kids:g("s-kages").split(/[,，、\s]+/).map(x=>parseInt(x)).filter(x=>x>=0&&x<60).slice(0,6),kn:g("s-kn").split(/[,，、]+/).map(x=>x.trim()).filter(Boolean),
          house:g("s-house"),hv:n("s-hv"),hl:n("s-hl"),hy:n("s-hy")||20,huse:g("s-huse"),car:g("s-car"),cv:n("s-cv"),cl:n("s-cl"),cm:n("s-cm")||36,pet:g("s-pet"),pn:g("s-pn").trim()}})(),
      health:Math.round(rr(65,85)),happy:Math.round(rr(50,70)),know:Math.round(rr(40,65)),social:Math.round(rr(45,70))});tab="home";render()};
}
// ===== 真實行情：網站上的 prices.json 由 GitHub Actions 每天自動從證交所、Yahoo Finance、CoinGecko 抓取 =====
let LIVE=null;
function applyLive(d){if(!d||!d.updated)return;const fx=d.usdtwd>20&&d.usdtwd<50?d.usdtwd:USD;USD=fx;
  let n=0;ASSETS.forEach(a=>{let v=null;
    if(a.type==="台股"||a.type==="ETF"){v=d.tw&&d.tw[a.id]}
    else if(a.type==="美股"){if(d.us&&d.us[a.id]){a.usd=d.us[a.id];v=Math.round(a.usd*fx)}}
    else if(a.id==="BTC"||a.id==="ETH"){if(d.crypto&&d.crypto[a.id]){a.usd=d.crypto[a.id];v=Math.round(a.usd*fx)}}
    else if(a.id==="GOLD"){if(d.gold){a.usd=d.gold;v=Math.round(d.gold*(a.conv||1)*fx)}}
    if(v>0){a.live=v;a.price=v;n++}});
  const dt=new Date(d.updated);DATA_DATE=`${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,"0")}/${String(dt.getDate()).padStart(2,"0")}`;
  const nt=dt.getFullYear()*12+dt.getMonth();if(nt>NOW_T)NOW_T=nt;
  LIVE={...d,n,at:dt};
  // 剛開局、還沒過任何一個月的「現在」遊戲，直接換成真實價格
  if(S&&S.mode==="sim"&&S.history.length<=1){ASSETS.forEach(a=>{if(a.live){S.prices[a.id]=a.live;S.p0[a.id]=a.live}})}
}
function liveBadge(){if(!LIVE)return "";const t=LIVE.at;return `<span class="chip live" title="資料來源：${esc((LIVE.sources||[]).join("、"))}">真實行情 ${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")} 更新</span>`}
load();migrate();render();
if(location.protocol.startsWith("http")&&!/claude\.ai|claudeusercontent/.test(location.host)){
  fetch("prices.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null).then(d=>{
    // 比特幣、以太幣直接從 CoinGecko 抓即時價格
    return fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd").then(r=>r.ok?r.json():null).catch(()=>null).then(c=>{
      if(!d&&!c)return;d=d||{updated:new Date().toISOString(),sources:[]};
      if(c&&c.bitcoin){d.crypto={...(d.crypto||{}),BTC:c.bitcoin.usd,ETH:c.ethereum&&c.ethereum.usd};d.sources=[...(d.sources||[]),"CoinGecko（即時）"]}
      applyLive(d);render()})})}
</script>
