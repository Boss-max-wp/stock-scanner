/* ---- night-market theme ---- */
:root{--bg:#EDEFF7;--dot:#D3D8EC;--frame:#262C66;--felt:#1C2052;--felt-hi:#3B3F99;--on-felt:#F7F4FF;--on-felt-muted:#BDB9EC;--corner:#FFF5E1;--shadow:rgba(30,34,90,.16);--lantern:#E8432E;--lantern-glow:#FFB347}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D0F21;--dot:#1A1E3A;--frame:#161A40;--felt:#13163A;--felt-hi:#2C3080;--corner:#262418;--panel:#151833;--cell:#1C2044;--line:#2D3260;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0D0F21;--dot:#1A1E3A;--frame:#161A40;--felt:#13163A;--felt-hi:#2C3080;--corner:#262418;--panel:#151833;--cell:#1C2044;--line:#2D3260;--shadow:rgba(0,0,0,.5)}
.cell{grid-row:var(--r8);grid-column:var(--c8)}
.center{background:radial-gradient(ellipse at 50% 18%,var(--felt-hi),var(--felt) 70%);background-color:var(--felt);overflow:hidden}
.center::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.2px 1.2px at 12% 30%,#fff,transparent),radial-gradient(1px 1px at 78% 22%,#fff,transparent),radial-gradient(1.4px 1.4px at 64% 70%,#fff,transparent),radial-gradient(1px 1px at 24% 82%,#fff,transparent),radial-gradient(1.2px 1.2px at 88% 58%,#fff,transparent),radial-gradient(1px 1px at 40% 48%,#fff,transparent)}
.lanterns{position:absolute;top:0;left:-4%;right:-4%;height:44px;display:flex;justify-content:space-around;align-items:flex-start;pointer-events:none;z-index:1}
.lanterns::before{content:"";position:absolute;left:0;right:0;top:-30px;height:44px;border-bottom:1.5px solid rgba(255,255,255,.35);border-radius:0 0 50% 50%}
.lanterns i{position:relative;width:15px;height:19px;margin-top:9px;border-radius:45%;background:radial-gradient(circle at 50% 40%,var(--lantern-glow),var(--lantern) 70%);box-shadow:0 0 12px 2px color-mix(in srgb,var(--lantern-glow) 60%,transparent);transform-origin:50% -8px;animation:sway 3s ease-in-out infinite}
.lanterns i::before{content:"";position:absolute;left:3px;right:3px;top:-3px;height:4px;background:#E9B949;border-radius:2px}
.lanterns i:nth-child(2),.lanterns i:nth-child(6){margin-top:15px;animation-delay:-1s}
.lanterns i:nth-child(3),.lanterns i:nth-child(5){margin-top:19px;animation-delay:-2s}
.lanterns i:nth-child(4){margin-top:21px;background:radial-gradient(circle at 50% 40%,#FFF0A8,var(--accent) 70%)}
@keyframes sway{50%{transform:rotate(6deg)}}
.center .wm{opacity:.06;color:#fff}
.ctop{margin-top:22px;background:rgba(255,255,255,.1)}
.tray{padding:10px 16px;border-radius:999px;background:radial-gradient(ellipse at 50% 30%,#7A4A2A,#4E2C17);box-shadow:inset 0 4px 10px rgba(0,0,0,.5),0 2px 0 rgba(255,255,255,.12);z-index:1}
#msg{background:rgba(255,255,255,.1);border-radius:14px;padding:7px 12px;position:relative}
#msg:empty{visibility:hidden}
.ticker{position:absolute;left:0;right:0;bottom:0;overflow:hidden;background:rgba(0,0,0,.28);border-top:1px solid rgba(255,255,255,.1);font-size:clamp(10px,2.8vw,12px);white-space:nowrap;z-index:1}
.ticker .tk{display:inline-flex;gap:22px;padding:5px 0;animation:tick 22s linear infinite}
.ticker span{color:var(--on-felt-muted)} .ticker b{color:var(--on-felt);font-weight:600}
.ticker em{font-style:normal;font-family:var(--f-num)} .ticker .up{color:#7BE3A6} .ticker .dn{color:#FF8A75}
@keyframes tick{to{transform:translateX(-50%)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.center{padding-bottom:30px}
@media (max-width:699px){
  .board{grid-template:repeat(10,minmax(0,1fr))/repeat(6,minmax(0,1fr));aspect-ratio:6/10;max-width:none}
  .cell{grid-row:var(--r6);grid-column:var(--c6);font-size:clamp(10px,3.1vw,13.5px)}
  .cell .ic{width:clamp(16px,5vw,22px);height:clamp(16px,5vw,22px)}
  .cell.corner .ic{width:clamp(18px,5.6vw,26px);height:clamp(18px,5.6vw,26px)}
  .center{grid-row:2/10;grid-column:2/6;gap:12px}
  .center .wm{writing-mode:vertical-rl;font-size:clamp(90px,30vw,150px)}
  .die{width:clamp(44px,13vw,58px)}
  .cbtns{flex-wrap:wrap;justify-content:center}
  #msg{max-width:24ch}
}
@media (prefers-reduced-motion: reduce){.lanterns i,.ticker .tk{animation:none}}

/* ---- light dusk center ---- */
:root{--felt:#EEEAFF;--felt-hi:#FFF4E4;--on-felt:#2B2766;--on-felt-muted:#6E6AA6;--veil:rgba(43,39,102,.07);--veil2:rgba(43,39,102,.14);--star:#E9A825;--string:rgba(43,39,102,.28);--tk-up:var(--gain);--tk-dn:var(--loss)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--felt:#13163A;--felt-hi:#2C3080;--on-felt:#F7F4FF;--on-felt-muted:#BDB9EC;--veil:rgba(255,255,255,.1);--veil2:rgba(255,255,255,.18);--star:#ffffff;--string:rgba(255,255,255,.35);--tk-up:#7BE3A6;--tk-dn:#FF8A75}}
:root[data-theme="dark"]{--felt:#13163A;--felt-hi:#2C3080;--on-felt:#F7F4FF;--on-felt-muted:#BDB9EC;--veil:rgba(255,255,255,.1);--veil2:rgba(255,255,255,.18);--star:#ffffff;--string:rgba(255,255,255,.35);--tk-up:#7BE3A6;--tk-dn:#FF8A75}
.center{box-shadow:inset 0 0 0 1px var(--veil2),inset 0 10px 30px var(--veil)}
.center::after{opacity:.5;background-image:radial-gradient(1.5px 1.5px at 12% 30%,var(--star),transparent),radial-gradient(1.2px 1.2px at 78% 22%,var(--star),transparent),radial-gradient(1.6px 1.6px at 64% 70%,var(--star),transparent),radial-gradient(1.2px 1.2px at 24% 82%,var(--star),transparent),radial-gradient(1.4px 1.4px at 88% 58%,var(--star),transparent),radial-gradient(1.2px 1.2px at 40% 48%,var(--star),transparent)}
.center .wm{color:var(--on-felt);opacity:.05}
.lanterns::before{border-bottom-color:var(--string)}
.ctop,#msg{background:var(--veil)}
.cbtns button{background:var(--veil);color:var(--on-felt)}
.cbtns button:hover{background:var(--veil2)}
.ticker{background:var(--veil);border-top-color:var(--veil2)}
.ticker .up{color:var(--tk-up)} .ticker .dn{color:var(--tk-dn)}
#actBtn{background:var(--on-felt);color:var(--felt-hi)}

.logo{width:40px;height:40px;border-radius:12px;flex:none;box-shadow:0 2px 6px var(--shadow),0 0 0 2px var(--panel)}

.amtrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.amtrow label{color:var(--muted);font-size:14px;flex:none}
.amtrow input{flex:1;min-width:0;font:inherit;font-family:var(--f-num);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--cell);color:var(--ink)}
.amtmsg{margin:8px 0 0;font-size:14px;font-weight:500;color:var(--accent-ink,var(--ink));background:var(--t-money);border-radius:10px;padding:6px 10px}
</style>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const d6=()=>1+Math.floor(Math.random()*6);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const JOBS=[['工讀生',800],['基層職員',1200],['小主管',1700],['經理',2300],['總監',3000],['執行長',4000]];
const ASSETS={
  chip:{n:'晶圓科技',u:'股',tag:'穩健成長',p0:120,vol:.07,drift:.008,lot:5},
  ship:{n:'海神航運',u:'股',tag:'景氣循環',p0:60,vol:.12,drift:.002,lot:10},
  bio:{n:'新藥生技',u:'股',tag:'高風險',p0:40,vol:.17,drift:.004,lot:20},
  coin:{n:'企鵝幣',u:'顆',tag:'超高波動',p0:15,vol:.28,drift:.01,lot:50}
};
const AK=Object.keys(ASSETS);
const B=[
 {t:'start',n:'起點',c:'corner'},
 {t:'prop',n:'基隆',g:0,price:600,rent:50},
 {t:'chance',n:'機會',c:'fate'},
 {t:'prop',n:'宜蘭',g:0,price:700,rent:60},
 {t:'stock',n:'證券所',c:'money'},
 {t:'prop',n:'桃園',g:1,price:900,rent:80},
 {t:'job',n:'人力銀行',c:'life'},
 {t:'night',n:'夜市',c:'corner'},
 {t:'prop',n:'新竹',g:1,price:1000,rent:90},
 {t:'lotto',n:'彩券行',c:'money'},
 {t:'prop',n:'台中',g:2,price:1200,rent:110},
 {t:'startup',n:'創業園區',c:'money'},
 {t:'prop',n:'彰化',g:2,price:1300,rent:120},
 {t:'crypto',n:'幣交易所',c:'money'},
 {t:'bank',n:'銀行',c:'corner'},
 {t:'prop',n:'嘉義',g:3,price:1500,rent:140},
 {t:'chance',n:'命運',c:'fate'},
 {t:'prop',n:'台南',g:3,price:1600,rent:150},
 {t:'stock',n:'證券所',c:'money'},
 {t:'prop',n:'屏東',g:4,price:1800,rent:170},
 {t:'school',n:'大學',c:'life'},
 {t:'tax',n:'國稅局',c:'corner'},
 {t:'prop',n:'高雄',g:4,price:1900,rent:180},
 {t:'chance',n:'機會',c:'fate'},
 {t:'prop',n:'花蓮',g:5,price:2200,rent:210},
 {t:'startup',n:'創業園區',c:'money'},
 {t:'prop',n:'台北',g:5,price:2600,rent:250},
 {t:'prop',n:'信義區',g:5,price:3000,rent:300},
];
const N=B.length;
const upCost=sq=>Math.round(sq.price*.5/50)*50;
const RENT_MULT=[1,3,6,10];
function credit(p){
  let land=0;for(const i in G.own){const o=G.own[i];if(o.p===p.id)land+=B[i].price+o.l*upCost(B[i])}
  const st=['chip','ship','bio'].reduce((s,k)=>s+p.hold[k]*G.prices[k],0),cn=p.hold.coin*G.prices.coin;
  const parts=[['薪水信用（4 個月薪水）',salary(p)*4,salary(p)*4],['地產 × 60%',land,land*.6],['股票 × 50%',st,st*.5],['企鵝幣 × 20%',cn,cn*.2],['存款 × 90%（扣掉貸款後的部分）',Math.max(0,p.savings-p.loan),Math.max(0,p.savings-p.loan)*.9]];
  return {parts,cap:Math.floor(parts.reduce((s,x)=>s+x[2],0)/100)*100};
}
const loanCap=p=>credit(p).cap;
// 九折只給「借超過一圈」的舊貸款；這一圈才借的錢要全額還，不然借了馬上九折還會白賺 10%
const LOAN_LAPS=3; // 借錢後，經過起點 3 次內要還清
function borrowMoney(p,x){ if(!(p.loan>0)) p.loanDue=LOAN_LAPS; p.cash+=x; p.loan+=x; p.loanNew=(p.loanNew||0)+x; }
function repayMoney(p,x){ x=Math.min(x,p.cash,p.loan); if(!(x>0))return 0; p.cash-=x; p.loan-=x; p.loanNew=Math.max(0,(p.loanNew||0)-x); if(p.loan<=0){p.loan=0;p.loanNew=0;p.loanDue=0} return x; }
const dueText=p=>{if(!(p.loan>0))return '';if(!p.loanDue)p.loanDue=LOAN_LAPS;return p.loanDue<=1?'下次經過起點就到期！':`再經過起點 ${p.loanDue} 次到期`};
const freshLoan=p=>Math.min(p.loan,p.loanNew||0);
const discPay=p=>Math.round((p.loan-freshLoan(p))*.9)+freshLoan(p);
const canBorrow=p=>Math.max(0,Math.floor((loanCap(p)-p.loan)/100)*100);
B.forEach(s=>{if(s.t==='prop')s.rent=Math.round(s.price*.25/10)*10});
const LV=['空地','一棟','兩棟','大樓'];
const VENTURES=['珍奶連鎖店','AI 外送平台','寵物鮮食','二手球鞋店','露營車租賃','手搖飲 App','手作飾品網店','健身工作室'];

let G=null;
const cur=()=>G.players[G.turn];
const NET={left:new Set(),watch:{},lastHost:null,ok:false,db:null,uid:'local',code:null,ref:null,unsub:null,applying:false,writing:false,pend:false,handoff:false,started:null,answered:{},overShown:null,first:true,inLobby:false,room:null};
function effHost(){
  const gone=u=>NET.left.has(u)||G.players.some(x=>!x.bot&&x.uid===u&&x.left);
  if(G.host&&!gone(G.host))return G.host;
  const h=G.players.find(x=>!x.bot&&!gone(x.uid));return h?h.uid:G.host;
}
const isDriverOf=p=>!G||!G.online||((p.bot||p.left||NET.left.has(p.uid))?effHost()===NET.uid:p.uid===NET.uid);
const drivingNow=()=>!!G&&isDriverOf(cur());
const meP=()=>G.online?G.players.find(x=>!x.bot&&x.uid===NET.uid):(cur().bot?(G.players.find(x=>!x.bot)||cur()):cur());
const salary=p=>JOBS[p.job][1];
function log(t,p){G.log.unshift({t,c:p?p.color:'var(--muted)'});G.log.length=Math.min(G.log.length,80)}
function say(t){G.msg=t}
function fx(){if(G)G.fx=(G.fx||0)+1}

function rc(i){if(i<=7)return[8,8-i];if(i<=14)return[8-(i-7),1];if(i<=21)return[1,1+(i-14)];return[1+(i-21),8]}
function rc6(i){if(i<=5)return[10,6-i];if(i<=14)return[10-(i-5),1];if(i<=19)return[1,1+(i-14)];return[1+(i-19),6]}

function newGame(cfg){
  const prices={},hist={},prev={};
  AK.forEach(k=>{prices[k]=ASSETS[k].p0;hist[k]=[ASSETS[k].p0];prev[k]=ASSETS[k].p0});
  G={gid:Math.random().toString(36).slice(2,9),online:!!cfg.online,host:cfg.host||'local',seq:0,v:0,players:cfg.players.map((c,i)=>({id:i,uid:c.uid||'local',name:c.name||('玩家'+(i+1)),bot:c.bot,color:`var(--p${i})`,cash:8000,pos:0,savings:0,loan:0,job:0,
      hold:{chip:0,ship:0,bio:0,coin:0},cost:{chip:0,ship:0,bio:0,coin:0},ventures:[],skip:0,out:false})),
     own:{},prices,hist,prev,round:1,mode:cfg.mode||'rounds',goal:cfg.goal||50000,maxRounds:cfg.mode==='goal'?60:cfg.mode==='last'?80:cfg.rounds,turn:0,phase:'roll',dice:[3,4],log:[],msg:'',over:false};
  log(G.mode==='goal'?`遊戲開始！誰的總資產先達到 ${fmt(G.goal)} 就贏（最多 60 輪）。`:G.mode==='last'?'遊戲開始！玩到只剩一個人沒破產為止（最多 80 輪）。':`遊戲開始！共 ${cfg.rounds} 輪，結束時總資產最高的人獲勝。`);
  if(G.online)NET.handoff=true;
  G.phase='start';render();maybeStart();
}

function worth(p){
  let w=p.cash+p.savings-p.loan;
  AK.forEach(k=>w+=p.hold[k]*G.prices[k]);
  for(const i in G.own){const o=G.own[i];if(o.p===p.id)w+=B[i].price+o.l*upCost(B[i])}
  p.ventures.forEach(v=>w+=v.cost);
  return Math.round(w);
}
function ownsGroup(pid,g){return B.every((s,i)=>s.g!==g||s.t!=='prop'||(G.own[i]&&G.own[i].p===pid))}
function rentOf(i){const o=G.own[i],s=B[i];let r=s.rent*RENT_MULT[o.l];if(o.l===0&&ownsGroup(o.p,s.g))r*=2;return r}

/* ---------- money ---------- */
function raise(p,need){
  const st=[];
  if(p.cash<need&&p.savings>0){const x=Math.min(p.savings,need-p.cash);p.savings-=x;p.cash+=x;st.push('提領存款')}
  for(const k of ['coin','bio','ship','chip']){if(p.cash<need&&p.hold[k]>0){p.cash+=Math.round(p.hold[k]*G.prices[k]);p.hold[k]=0;p.cost[k]=0;st.push('賣出'+ASSETS[k].n)}}
  p.ventures.length&&p.cash<need&&(p.ventures=[],st.push('放棄創業投資'));
  const mine=Object.keys(G.own).filter(i=>G.own[i].p===p.id).sort((a,b)=>B[a].price-B[b].price);
  for(const i of mine){if(p.cash>=need)break;const v=Math.round((B[i].price+G.own[i].l*upCost(B[i]))*.5);p.cash+=v;delete G.own[i];st.push(`半價賣掉${B[i].n}`)}
  if(st.length)log(`${p.name} 現金不夠：${st.join('、')}`,p);
}
function payTo(p,amt,to){
  amt=Math.round(amt);if(p.cash<amt)raise(p,amt);
  const paid=Math.min(amt,Math.max(0,p.cash));p.cash-=paid;if(to)to.cash+=paid;
  if(paid<amt)bankrupt(p);return paid;
}
function bankrupt(p){
  p.out=true;p.cash=0;p.savings=0;p.loan=0;p.loanNew=0;p.loanDue=0;p.ventures=[];AK.forEach(k=>p.hold[k]=0);
  for(const i in G.own)if(G.own[i].p===p.id)delete G.own[i];
  log(`${p.name} 破產出局了！`,p);
  if(G.players.filter(x=>!x.out).length<=1)gameOver();
}
function passStart(p){
  const s=salary(p);p.cash+=s;let t=`${p.name} 經過起點，領薪水 ${fmt(s)}`;
  if(p.savings>0){const it=Math.round(p.savings*.05);p.savings+=it;t+=`，存款利息 ${fmt(it)}`}
  if(p.loan>0){const it=Math.round(p.loan*.08);p.loan+=it;t+=`，貸款利息 ${fmt(it)}`}
  p.loanNew=0;
  log(t,p);
  if(p.loan>0){
    p.loanDue=(p.loanDue||LOAN_LAPS)-1;
    if(p.loanDue<=0){
      const owe=p.loan;log(`${p.name} 的貸款到期了，銀行強制收回 ${fmt(owe)}`,p);say(`${p.name} 的貸款到期，銀行來收錢了！`);
      p.loan=0;p.loanNew=0;p.loanDue=0;payTo(p,owe,null);
    }else if(p.loanDue===1) log(`⚠ ${p.name} 的貸款下次經過起點就到期，要準備 ${fmt(Math.round(p.loan*1.08))} 還款，不然銀行會強制賣你的東西`,p);
  }
}
function tickMarket(){
  AK.forEach(k=>{const a=ASSETS[k];G.prev[k]=G.prices[k];let m=Math.exp(a.drift-a.vol*a.vol/2+a.vol*gauss());
    if(k==='coin'){const r=Math.random();if(r<.04)m*=2.2;else if(r<.08)m*=.4}
    G.prices[k]=Math.max(1,G.prices[k]*m);G.hist[k].push(G.prices[k]);if(G.hist[k].length>30)G.hist[k].shift()});
}
function bumpAll(keys,m){keys.forEach(k=>{G.prices[k]=Math.max(1,G.prices[k]*m);G.hist[k].push(G.prices[k]);if(G.hist[k].length>30)G.hist[k].shift()})}
function trade(p,k,q){
  const pr=G.prices[k];
  if(q>0){const c=Math.round(pr*q);if(c>p.cash)return false;p.cost[k]=(p.cost[k]*p.hold[k]+pr*q)/(p.hold[k]+q);p.hold[k]+=q;p.cash-=c;log(`${p.name} 買進 ${ASSETS[k].n} ${q}${ASSETS[k].u}（${fmt(c)}）`,p)}
  else{q=Math.min(-q,p.hold[k]);if(!q)return false;const c=Math.round(pr*q);p.hold[k]-=q;if(!p.hold[k])p.cost[k]=0;p.cash+=c;
    const pl=Math.round((pr-(p.cost[k]||pr))*q);log(`${p.name} 賣出 ${ASSETS[k].n} ${q}${ASSETS[k].u}（${fmt(c)}）`,p)}
  return true;
}

async function choose(title,body,opts,pick,plain){
  const p=cur();
  if(p.bot)return sleep(650).then(pick);
  while(true){
    G.phase='choose';render();
    const list=opts.map(o=>({...o,disabled:o.disabled||(o.cost>p.cash)}));
    const short=opts.filter(o=>o.cost>p.cash&&!o.disabled);
    let b=typeof body==='function'?body():body;
    if(!plain){
      if(short.length)b+=`<p class="hint">錢不夠嗎？還差 <b class="num loss">${fmt(Math.min(...short.map(o=>o.cost))-p.cash)}</b>。可以先去<b>股市</b>賣股票或幣、用<b>網銀</b>借錢或領存款，弄好回來這裡就能買。</p>`;
      list.push({label:'股市・幣市',v:'__mkt',kind:'tool'},{label:'網銀（借錢・領錢）',v:'__bank',kind:'tool'});
    }
    const v=await new Promise(res=>openSheet(title,b,list.map(o=>({...o,on:()=>{closeSheet();res(o.v)}})),false));
    if(v==='__mkt'){await new Promise(res=>{sheetOnClose=res;openMarket()});render();continue}
    if(v==='__bank'){await bankLoop(p,false);render();continue}
    return v;
  }
}

async function propOffer(p,i){
  const sq=B[i],o=G.own[i];
  if(G.propDone){say(o&&o.p===p.id?`這回合已經在${sq.n}買過地或蓋過房子了，下次再停在這裡才能再蓋。`:`這回合已經處理過${sq.n}了。`);return}
  do{
    if(!o){
      if(p.cash<sq.price&&(p.bot||liquid(p)+canBorrow(p)<sq.price)){say(`${sq.n} 要 ${fmt(sq.price)}，${p.name} 的錢不夠買。`);return}
      const v=await choose(`要買下${sq.n}嗎？`,()=>`<p>地價 <b class="num">${fmt(sq.price)}</b>，別人踩到要付 <b class="num">${fmt(sq.rent)}</b> 過路費。</p><p>蓋房子後過路費會變成 3、6、10 倍；同色地全買齊，空地過路費加倍。每次停在自己的地上只能蓋一層，買地的那一次不能馬上蓋。</p>`+`<p>你目前現金 <span class="num">${fmt(p.cash)}</span>。</p>`,
        [{label:`買下 ${fmt(sq.price)}`,v:1,kind:'primary',cost:sq.price},{label:'不買',v:0}],()=>p.cash>sq.price+1500?1:0);
      if(v){G.propDone=true;p.cash-=sq.price;G.own[i]={p:p.id,l:0};fx();log(`${p.name} 買下 ${sq.n}（${fmt(sq.price)}）`,p);say(`${p.name} 買下了${sq.n}！`)}
      else say(`${p.name} 沒有買${sq.n}。`);
    }else if(o.p===p.id){
      const c=upCost(sq);
      if(o.l>=3){say(`${sq.n} 已經是大樓了。`);return}
      if(p.cash<c&&(p.bot||liquid(p)+canBorrow(p)<c)){say(`回到自己的${sq.n}，但蓋房子要 ${fmt(c)}。`);return}

        [{label:`蓋 ${fmt(c)}`,v:1,kind:'primary',cost:c},{label:'先不要',v:0}],()=>p.cash>c+2000?1:0);

async function negotiate(p,ow,i){
  G.negDone=true;
  const sq=B[i],o=G.own[i],val=sq.price+o.l*upCost(sq);
  let minM=0,tries=0;
  while(tries<3){
    const avail=OFFERS.filter(m=>m>minM);
    if(!avail.length)break;
    if(liquid(p)+canBorrow(p)<val*avail[0])break;
    let m;
    if(p.bot){
      const want=OFFERS.find(x=>x>minM&&p.cash>val*x+2500);
      if(!want||Math.random()<.55)break;
      m=want;
    }else{
      m=await choose(tries?`${ow.name} 不賣，要加價嗎？`:`要跟${ow.name}買${sq.n}嗎？`,()=>`<p>出價越高，對方越可能答應。如果他已經買齊同顏色的地，會更捨不得賣；他缺錢的時候比較容易成交。</p><p>${sq.n}的價值 <span class="num">${fmt(val)}</span>（地價${o.l?'加房子':''}），你的現金 <span class="num">${fmt(p.cash)}</span>。</p>${tries?'<p>每次加價都要比上次高，最多談三次。</p>':''}`,
        [...avail.map(x=>({label:`出 ${fmt(val*x)}（${x} 倍）`,v:x,kind:x===avail[0]?'primary':'',cost:val*x})),{label:'不買了',v:0}],()=>0);
      if(!m)break;
    }
    const price=Math.round(val*m);
    if(p.cash<price)break;
    tries++;minM=m;
    let ok;
    if(ow.bot){ok=Math.random()<acceptChance(ow,i,m);if(!p.bot)await sleep(400)}
    else ok=(G.online&&ow.uid!==NET.uid)?await askRemote(ow,p,i,price):await askOwner(ow,p,i,price);
    if(ok){p.cash-=price;ow.cash+=price;G.own[i].p=p.id;fx();log(`${ow.name} 以 ${fmt(price)} 把 ${sq.n} 賣給 ${p.name}`,p);say(`成交！${p.name} 用 ${fmt(price)} 買下${sq.n}。`);render();
      if(!p.bot)await notify('成交！',`<p>${esc(ow.name)} 答應了，${sq.n}現在是你的。</p><p class="big loss">-${fmt(price)}</p>`);return}
    log(`${p.name} 出價 ${fmt(price)} 想買 ${sq.n}，${ow.name} 拒絕了`,p);say(`${ow.name} 拒絕了 ${fmt(price)} 的出價。`);render();
  }
}
async function bankVisit(p){

    const acts=[

      {label:'還 $500',v:'r5',disabled:!p.loan||p.cash<Math.min(500,p.loan)},{label:'還 $1,000',v:'r1k',disabled:!p.loan||p.cash<Math.min(1000,p.loan)},{label:canPay?`能還多少還多少 ${fmt(canPay)}`:'能還多少還多少',v:'ra',disabled:!canPay},

const atCounter=p=>!!G&&G.phase==='done'&&B[p.pos].t==='bank'&&!p.bot&&drivingNow();
function resolveVenture(p,v){
  const r=Math.random();let m,t;
  if(r<.4){m=0;t='倒閉了'}else if(r<.65){m=1;t='打平收場'}else if(r<.9){m=3;t='大成功'}else{m=8;t='變成獨角獸'}
  if(m>=3)fx();
  const back=v.cost*m;p.cash+=back;
  log(`${p.name} 投資的「${v.n}」${t}，拿回 ${fmt(back)}（投入 ${fmt(v.cost)}）`,p);
  return {t,back,v};
}

async function startTurn(){
  if(G.over)return;const p=cur();
  if(p.out)return nextTurn();
  const done=[];p.ventures.forEach(v=>{v.t--;if(v.t<=0)done.push(resolveVenture(p,v))});
  p.ventures=p.ventures.filter(v=>v.t>0);
  if(done.length&&!p.bot){G.phase='choose';render();await notify('創業投資揭曉',done.map(d=>`<p>「${d.v.n}」${d.t}：投入 ${fmt(d.v.cost)}，拿回 <b class="num ${d.back>=d.v.cost?'gain':'loss'}">${fmt(d.back)}</b></p>`).join(''))}
  if(p.skip>0){p.skip--;log(`${p.name} 出國旅遊中，跳過這回合`,p);say(`${p.name} 還在國外玩，跳過。`);G.phase='wait';render();await sleep(1100);return nextTurn()}
  G.negDone=false;G.propDone=false;
  G.phase='roll';say(p.bot?`${p.name} 準備擲骰子…`:`輪到 ${p.name}，擲骰子吧！`);render();
  if(p.bot){await sleep(800);doRoll()}
}
async function doRoll(){
  if(!G||G.phase!=='roll')return;
  const p=cur();G.phase='moving';G.demo=false;closeSheet();
  for(let k=0;k<6;k++){G.dice=[d6(),d6()];renderDice();await sleep(60)}
  const a=d6(),b=d6();G.dice=[a,b];say(`${p.name} 擲出 ${a+b} 點`);render();await sleep(350);
  for(let s=0;s<a+b;s++){p.pos=(p.pos+1)%N;if(p.pos===0)passStart(p);render();await sleep(130)}
  await landOn(p);

  G.phase='done';render();
  if(p.bot||p.out){if(!p.out)botTrade(p);render();await sleep(900);endTurn()}
}
function botTrade(p){
  AK.forEach(k=>{if(p.hold[k]&&(G.prices[k]>p.cost[k]*1.3||G.prices[k]<p.cost[k]*.6||Math.random()<.08))trade(p,k,-p.hold[k])});
  if(p.cash>4500&&Math.random()<.55){const k=rnd(AK),q=Math.floor(p.cash*.12/G.prices[k]);if(q>0)trade(p,k,q)}

function endTurn(){
  if(!G||G.over)return;closeSheet();tryApplyLeaves();if(!G||G.over)return;if(G.online&&drivingNow())NET.handoff=true;tickMarket();nextTurn();

function nextTurn(){
  if(G.over)return;
  if(G.online&&drivingNow())NET.handoff=true;
  if(G.players.filter(x=>!x.out).length<=1)return gameOver();
  let guard=0;
  do{G.turn=(G.turn+1)%G.players.length;if(G.turn===0)G.round++;}while(cur().out&&guard++<10);
  if(G.mode==='goal'&&G.players.some(x=>!x.out&&worth(x)>=G.goal))return gameOver();
  if(G.round>G.maxRounds)return gameOver();
  G.seq=(G.seq||0)+1;G.phase='start';render();maybeStart();
}
function maybeStart(){

function readNames(){const nk=$('#nick');if(nk)setNick(nk.value.trim());setupCfg.players.forEach((p,i)=>{const el=$('#pn'+i);if(el)p.name=el.value.trim()||('玩家'+(i+1))})}
$('#sheet').addEventListener('click',e=>{
  if(e.target.closest('[data-join]')){joinRoom();return}
  const t=e.target.closest('[data-sn],[data-sb],[data-sr],[data-sm],[data-sg],[data-sw]');if(!t)return;readNames();

/* ---------- online sync ---------- */
function persist(){
  if(!G||NET.applying)return;
  if(!G.online){try{localStorage.setItem('tw-tycoon-v1',JSON.stringify(G))}catch(e){}return}
  if(!NET.ref||!(drivingNow()||NET.handoff))return;
  queueWrite();
}
async function queueWrite(){
  if(NET.writing){NET.pend=true;return}
  NET.writing=true;
  try{
    do{
      NET.pend=false;
      G.v=(G.v||0)+1;
      const body={gs:JSON.stringify(G),v:G.v,status:'playing'};
      try{await NET.ref.update(body)}catch(e){await sleep(600);try{await NET.ref.update(body)}catch(e2){}}
      await sleep(120);
    }while(NET.pend);
  }finally{NET.writing=false;NET.handoff=false}
}
function applySnapshot(d){
  let g;try{g=JSON.parse(d.gs)}catch(e){return}
  if(!g||!g.players)return;
  if(G&&G.online&&G.gid===g.gid&&(g.v||0)<=(G.v||0))return;
  const newGameArrived=!G||G.gid!==g.gid;
  NET.applying=true;G=g;render();NET.applying=false;
  if(newGameArrived)NET.first=true;
  if(G.over){if(NET.overShown!==G.gid){NET.overShown=G.gid;showResults()}return}
  if(G.ask&&G.players[G.ask.seller]&&G.players[G.ask.seller].uid===NET.uid&&!NET.answered[G.ask.id]){
    const a=G.ask;NET.answered[a.id]=true;
    const buyer=G.players[a.buyer];
    openSheet(`${buyer.name} 想買你的${B[a.i].n}`,`<p>${esc(buyer.name)} 出價 <b class="num">${fmt(a.price)}</b> 想買下${B[a.i].n}（現在過路費 ${fmt(G.own[a.i]?rentOf(a.i):0)}）。</p><p>60 秒內沒回覆就當作不賣。</p>`,
      [{label:`賣 ${fmt(a.price)}`,kind:'primary',on:()=>{closeSheet();NET.db.doc(`games/${NET.code}/ans/${a.id}`).set({ok:true}).catch(()=>{})}},
       {label:'不賣',on:()=>{closeSheet();NET.db.doc(`games/${NET.code}/ans/${a.id}`).set({ok:false}).catch(()=>{})}}],false);
  }
  setupLeaveWatch();
  if(NET.first){NET.first=false;NET.lastHost=effHost();recoverStale()}
  tryApplyLeaves();
  maybeStart();
}
function recoverStale(){
  const p=cur();if(!isDriverOf(p))return;
  if(['moving','choose','wait'].includes(G.phase)){G.phase='done';render()}
  if(p.bot){if(G.phase==='roll')doRoll();else if(G.phase==='done')endTurn()}
}
/* ---------- leaving a game ---------- */
function leaveKey(uid){return `games/${NET.code}/ans/leave-${G.gid}-${uid}`.replace(/[^A-Za-z0-9_\-\/.~:@+]/g,'_')}
function setupLeaveWatch(){
  if(!G||!G.online||!NET.db||!NET.code)return;
  G.players.forEach(q=>{if(q.bot||q.uid===NET.uid)return;const k=G.gid+':'+q.uid;if(NET.watch[k])return;
    try{NET.watch[k]=NET.db.doc(leaveKey(q.uid)).onSnapshot(sn=>{if(sn.exists){NET.left.add(q.uid);tryApplyLeaves()}},()=>{})}catch(e){}});
}
function clearLeaveWatch(){Object.values(NET.watch).forEach(u=>{try{u()}catch(e){}});NET.watch={};NET.left.clear();NET.lastHost=null}
function applyLeave(q){
  q.left=true;q.out=true;q.cash=0;q.savings=0;q.loan=0;q.loanNew=0;q.ventures=[];AK.forEach(k=>q.hold[k]=0);
  for(const i in G.own)if(G.own[i].p===q.id)delete G.own[i];
  log(`${q.name} 離開了遊戲，他的地還給銀行了`,q);
  if(G.host===q.uid){const h=G.players.find(x=>!x.bot&&!x.left&&!NET.left.has(x.uid));if(h)G.host=h.uid}
  NET.handoff=true;
  if(G.players.filter(x=>!x.out).length<=1){gameOver();return}
  if(cur()===q){G.phase='done';nextTurn()}else render();
}
function tryApplyLeaves(){
  if(!G||!G.online||G.over||!NET.left.size)return;
  for(const uid of NET.left){
    const q=G.players.find(x=>!x.bot&&x.uid===uid);if(!q||q.left)continue;
    if(!drivingNow())continue;
    if(cur()!==q&&!['roll','done','start'].includes(G.phase))continue;
    applyLeave(q);if(G.over)return;
  }
  const h=effHost();
  if(h!==NET.lastHost){const was=NET.lastHost;NET.lastHost=h;if(was&&h===NET.uid)takeover()}
}
function takeover(){
  if(!G||G.over)return;const p=cur();if(!isDriverOf(p)||!(p.bot||p.left))return;
  if(G.phase==='start'){maybeStart();return}
  if(G.phase==='roll'){if(p.bot)doRoll();else{G.phase='done';NET.handoff=true;endTurn()}return}
  G.phase='done';NET.handoff=true;endTurn();
}
async function quitOnline(){
  closeSheet();
  const me=G&&G.players.find(x=>!x.bot&&x.uid===NET.uid);
  if(!G||!G.online||G.over||!me||me.out){leaveRoom();return}
  say(`${me.name} 離開了遊戲`);
  if(cur()===me&&drivingNow()&&!NET.applying)applyLeave(me);
  try{await NET.db.doc(leaveKey(me.uid)).set({uid:me.uid,t:Date.now()})}catch(e){}
  for(let k=0;k<40&&(NET.writing||NET.pend||NET.handoff);k++)await sleep(100);
  leaveRoom();
}
function openQuit(){
  if(!G)return;
  if(G.online){
    const me=G.players.find(x=>!x.bot&&x.uid===NET.uid);
    const hostBots=G.host===NET.uid&&G.players.some(x=>x.bot&&!x.out);
    openSheet('要退出線上遊戲嗎？',`<p>退出後你會<b>直接出局</b>，你的地會還給銀行，其他人可以繼續玩。</p>${hostBots?'<p>電腦玩家會改由其他人的手機代打。</p>':''}${me&&me.out?'<p>你已經出局了，可以直接離開。</p>':''}`,
      [{label:'退出遊戲',kind:'primary',on:quitOnline},{label:'繼續玩',on:closeSheet}],true);
    return;
  }
  openSheet('要退出這局嗎？',`<p>現在是第 ${Math.min(G.round,G.maxRounds||G.round)} 輪。你可以現在結束、照總資產排名，或直接放棄這局。</p>`,
    [{label:'結束並看排名',kind:'primary',on:()=>{closeSheet();G.endedEarly=true;log('提前結束這局。');gameOver()}},
     {label:'放棄這局，開新遊戲',on:()=>{closeSheet();G.over=true;G.abandoned=true;G.phase='over';say('這局已放棄。');render();showSetup()}},
     {label:'繼續玩',on:closeSheet}],true);
}
function askRemote(seller,buyer,i,price){
  const id='a'+Date.now().toString(36)+Math.floor(Math.random()*1e4);
  G.ask={id,seller:seller.id,buyer:buyer.id,i,price};say(`等 ${seller.name} 回覆要不要賣…`);render();
  return new Promise(res=>{
    let un=null,done=false;
    const fin=v=>{if(done)return;done=true;clearTimeout(t);un&&un();G.ask=null;res(v)};
    const t=setTimeout(()=>fin(false),60000);
    try{un=NET.db.doc(`games/${NET.code}/ans/${id}`).onSnapshot(sn=>{if(sn.exists)fin(!!(sn.data()||{}).ok)},()=>fin(false))}catch(e){fin(false)}
  });
}
const CODE_CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const BOTN=['阿財','小美','王董','阿嬤','包租公'];
function nick(){try{return localStorage.getItem('tw-tycoon-nick')||''}catch(e){return ''}}
function setNick(v){try{localStorage.setItem('tw-tycoon-nick',v)}catch(e){}}
function rememberRoom(c){try{c?localStorage.setItem('tw-tycoon-room',c):localStorage.removeItem('tw-tycoon-room')}catch(e){}}
function subscribe(code){
  NET.unsub&&NET.unsub();
  NET.code=code;NET.ref=NET.db.doc('games/'+code);NET.first=true;rememberRoom(code);
  NET.unsub=NET.ref.onSnapshot(sn=>{
    if(!sn.exists){return}
    const d=sn.data();NET.room=d;
    if(d.status==='lobby'){NET.inLobby=true;showLobby(d)}
    else if(d.gs){if(NET.inLobby){NET.inLobby=false;closeSheet()}applySnapshot(d)}
  },()=>{});
}
function leaveRoom(){
  NET.unsub&&NET.unsub();clearLeaveWatch();NET.unsub=null;NET.ref=null;NET.code=null;NET.inLobby=false;rememberRoom(null);
  G=null;newGame({players:[{name:'我',bot:false},{name:'阿財',bot:true},{name:'小美',bot:true}],rounds:20});G.demo=true;G.msg='設定玩家後就能開始。'
  render();showSetup();
}
async function createRoom(){
  const n=($('#nick')?.value||'').trim()||'玩家';setNick(n);
  let code='';for(let k=0;k<4;k++)code+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];
  const c=setupCfg;
  try{await NET.db.doc('games/'+code).set({status:'lobby',host:NET.uid,seats:[{uid:NET.uid,name:n,bot:false}],cfg:{rounds:c.rounds,mode:c.mode,goal:c.goal},gs:'',v:0})}
  catch(e){openSheet('建立失敗',`<p>${permErr(e)||'連線出問題了，請稍後再試一次。'}</p>`,[{label:'回去',kind:'primary',on:showSetup}],true);return}
  subscribe(code);
}
async function joinRoom(){
  const n=($('#nick')?.value||'').trim()||'玩家';setNick(n);
  const code=($('#codeIn')?.value||'').trim().toUpperCase();
  const err=m=>openSheet('加入失敗',`<p>${m}</p>`,[{label:'回去',kind:'primary',on:showSetup}],true);
  if(!/^[A-Z0-9]{4}$/.test(code))return err('房號是 4 個英文或數字，請再確認一次。');
  const ref=NET.db.doc('games/'+code);
  try{
    let sn=await ref.get();
    if(!sn.exists)return err(`找不到房間 ${code}。請確認房號，或請房主先建立房間。`);
    let d=sn.data();
    if(!d.seats.some(x=>x.uid===NET.uid)){
      if(d.status!=='lobby'){subscribe(code);return}
      if(d.seats.length>=4)return err('這個房間已經滿 4 人了。');
      if(ref.addSeat){const r=await ref.addSeat({uid:NET.uid,name:n,bot:false});if(r==='full')return err('這個房間已經滿 4 人了。')}
      else{
        const l=await ref.acquire({holder:NET.uid,ttlMs:4000});
        if(!l.acquired){await sleep(1500)}
        sn=await ref.get();d=sn.data();
        if(d.seats.length>=4)return err('這個房間已經滿 4 人了。');
        await ref.update({seats:[...d.seats,{uid:NET.uid,name:n,bot:false}]});
      }
    }
    subscribe(code);
  }catch(e){err(permErr(e)||'連線出問題了，請稍後再試一次。')}
}
function showLobby(d){
  const host=d.host===NET.uid;
  const body=`<p style="font-size:13px;color:var(--muted)">房號</p><p class="big" style="letter-spacing:.2em;margin:0 0 8px">${esc(NET.code)}</p>
  <p>請朋友打開這個網頁，選「線上連線」，輸入房號 <b>${esc(NET.code)}</b> 就能加入。</p>
  <div class="rank">${d.seats.map((x,i)=>`<div><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--p${i})"></i> ${esc(x.name)}${x.bot?'（電腦）':''}${x.uid===NET.uid?'（你）':''}${x.uid===d.host?'・房主':''}</span><span style="color:var(--muted);font-size:13px">${x.bot?'由房主的手機代打':'已加入'}</span></div>`).join('')}</div>
  <p style="font-size:13px;color:var(--muted)">${host?'人到齊就按開始。2～4 人，不夠可以加電腦。':'等房主按開始…'}</p>`;
  const acts=host?[{label:'開始遊戲',kind:'primary',disabled:d.seats.length<2,on:()=>hostStart(d)},
     {label:'加一個電腦',disabled:d.seats.length>=4,on:()=>NET.ref.update({seats:[...d.seats,{uid:null,name:BOTN.find(b=>!d.seats.some(x=>x.name===b))||'電腦',bot:true}]}).catch(()=>{})},
     {label:'移除電腦',disabled:!d.seats.some(x=>x.bot),on:()=>{const k=d.seats.map(x=>x.bot).lastIndexOf(true);NET.ref.update({seats:d.seats.filter((_,i)=>i!==k)}).catch(()=>{})}},
     {label:'離開房間',on:leaveRoom}]
    :[{label:'離開房間',on:async()=>{try{await NET.ref.update({seats:d.seats.filter(x=>x.uid!==NET.uid)})}catch(e){}leaveRoom()}}];
  openSheet(`線上房間 ${NET.code}`,body,acts,false);
}
function hostStart(d){
  closeSheet();NET.inLobby=false;
  newGame({...d.cfg,online:true,host:NET.uid,players:d.seats.map(x=>({name:x.name,bot:x.bot,uid:x.uid||'bot'}))});
}
function permErr(e){
  if(!e)return '';
  if(NET.kind==='fb'&&(e.code==='permission-denied'||e.code==='firestore/permission-denied'))return '線上伺服器還沒開放權限，請網站管理員到 Firebase 的 Firestore 規則加上大富翁那一段。';
  if(e.code==='invalid_argument')return '你沒有寫入這個遊戲的權限。請房主在「分享」裡用 email 邀請你，權限選「編輯者」。';
  return '';
}
async function initNet(){
  if(window.FBNET){
    try{
      const fb=await window.FBNET;if(!fb)return;
      let id=null;try{id=localStorage.getItem('tw-tycoon-uid')}catch(e){}
      if(!id){id='p'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);try{localStorage.setItem('tw-tycoon-uid',id)}catch(e){}}
      NET.db=fb;NET.uid=id;NET.ok=true;NET.kind='fb';
      let code=null;try{code=localStorage.getItem('tw-tycoon-room')}catch(e){}
      if(code){closeSheet();subscribe(code)}
      else if($('#sheetWrap').hidden===false&&setupCfg.where==='online')showSetup();
    }catch(e){}
    return;
  }
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    NET.db=db;NET.uid=id;NET.ok=true;
    let code=null;try{code=localStorage.getItem('tw-tycoon-room')}catch(e){}
    if(code){closeSheet();subscribe(code)}
  }catch(e){}
}

/* ---------- render ---------- */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieHTML(n){return Array.from({length:9},(_,i)=>`<span class="${PIPS[n].includes(i)?'on':''}"></span>`).join('')}
let lastDice='';
const lastCash={};let lastFx;
function confetti(n=90){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#fx'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cs=getComputedStyle(document.documentElement),cols=['--accent','--p0','--p1','--p2','--p3','--g2'].map(k=>cs.getPropertyValue(k).trim()||'#F0AA1E');
  const ps=Array.from({length:n},()=>({x:innerWidth*(.3+Math.random()*.4),y:innerHeight*.45,vx:(Math.random()-.5)*11,vy:-6-Math.random()*9,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)],coin:Math.random()<.35}));
  let t=0;const step=()=>{t++;ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(q=>{q.vy+=.35;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;
      if(q.coin){ctx.beginPath();ctx.ellipse(0,0,q.s*.8,q.s*.8*Math.abs(Math.cos(q.r)),0,0,7);ctx.fill()}else ctx.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);ctx.restore()});
    if(t<110)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height)};
  requestAnimationFrame(step);
}
function renderDice(){const k=G.dice.join();const ch=k!==lastDice;lastDice=k;[$('#d1'),$('#d2')].forEach((el,i)=>{el.innerHTML=dieHTML(G.dice[i]);el.classList.toggle('d1',G.dice[i]===1);if(ch){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}})}
const ICP={start:'M19 12H5M11 6l-6 6 6 6',night:'M3 9l2-5h14l2 5M4 9v11h16V9M3 9h18M9 20v-6h6v6',bank:'M3 10l9-6 9 6M5 10v8M9.7 10v8M14.3 10v8M19 10v8M3 20h18',
tax:'M6 3h9l4 4v14H6zM9 16l6-6M9.5 10.5h.01M14.5 15.5h.01',chance:'M9 9a3 3 0 1 1 4 2.8c-.8.4-1 1-1 1.7V15M12 18.5h.01',fate:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
stock:'M3 17l6-6 4 4 8-8M15 7h6v6',crypto:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M10 7.5v9M10 8h3.5a2 2 0 0 1 0 4H10M10 12h4a2.2 2.2 0 0 1 0 4.5h-4',job:'M4 8h16v11H4zM9 8V5h6v3M4 13h16',
school:'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5',lotto:'M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4zM14 7v10',startup:'M12 15l-3-3c1-4 4-8 9-9-1 5-5 8-9 9M9 12l-4 1 2-4M12 15l-1 4 4-2M5 19l2-2'};
const icon=k=>`<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICP[k]}"/></svg></span>`;
const HOUSE='<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5L5 1.2 9 5v4H1z"/></svg>';
function buildBoard(){
  const bd=$('#board');
  B.forEach((s,i)=>{const [r,c]=rc(i);const el=document.createElement('div');
    el.className=`cell ${s.t==='prop'?'prop':''} ${s.c||''}`;const [r6,c6]=rc6(i);el.style.setProperty('--r8',r);el.style.setProperty('--c8',c);el.style.setProperty('--r6',r6);el.style.setProperty('--c6',c6);el.id='c'+i;
    el.innerHTML=(s.t==='prop'?`<i class="band" style="background:var(--g${s.g})"></i><b>${s.n}</b><small>$${s.price}</small><span class="pips"></span>`:`${icon(s.t==='chance'&&s.n==='命運'?'fate':s.t)}<b>${s.n}</b>`)+'<span class="tok"></span>';
    bd.appendChild(el)});
}
function render(){
  if(!G)return;
  B.forEach((s,i)=>{const el=$('#c'+i),o=G.own[i];
    if(s.t==='prop'){el.classList.toggle('owned',!!o);el.style.setProperty('--own',o?G.players[o.p].color:'transparent');el.querySelector('.pips').innerHTML=o?HOUSE.repeat(o.l):''}
    el.querySelector('.tok').innerHTML=G.players.filter(p=>!p.out&&p.pos===i).map(p=>`<i class="${p.id===G.turn&&!G.over?'me':''}" style="background:${p.color}" title="${esc(p.name)}"></i>`).join('');
    el.classList.toggle('here',!G.over&&cur().pos===i)});
  const p=cur();
  $('#who').innerHTML=`<i style="background:${p.color}"></i>${esc(p.name)}${p.bot?'（電腦）':''}${G.online&&!p.bot&&p.uid===NET.uid?'（你）':''}`;
  $('#rd').textContent=G.mode==='goal'?`第 ${G.round} 輪・目標 ${G.goal/10000} 萬`:G.mode==='last'?`第 ${G.round} 輪・撐到最後`:`第 ${Math.min(G.round,G.maxRounds)} / ${G.maxRounds} 輪`;
  renderDice();$('#msg').textContent=G.msg;
  const ab=$('#actBtn'),sqh=B[p.pos],oh=G.own[p.pos];
  let at='';
  if(!G.over&&!p.bot&&drivingNow()&&G.phase==='done'&&sqh.t==='prop'){
    if(G.propDone){}
    else if(!oh)at=`買下${sqh.n} ${fmt(sqh.price)}`;
    else if(oh.p===p.id&&oh.l<3)at=`在${sqh.n}蓋房子 ${fmt(upCost(sqh))}`;
    else if(oh.p!==p.id&&!G.negDone)at=`跟 ${G.players[oh.p].name} 出價買${sqh.n}`;
  }
  if(!G.over&&atCounter(p))at='回到銀行櫃台';
  ab.hidden=!at;ab.textContent=at;
  $('#newBtn').textContent=!G.over&&!G.demo?'退出':'新遊戲';
  $('#bankBtn').textContent=!G.over&&atCounter(p)?'銀行櫃台':'網銀';
  const mb=$('#mainBtn');
  if(G.over){mb.textContent='看排名';mb.disabled=false}
  else if(p.bot){mb.textContent='電腦行動中…';mb.disabled=true}
  else if(!drivingNow()){mb.textContent=`等 ${p.name} 行動…`;mb.disabled=true}
  else if(G.phase==='roll'){mb.textContent='擲骰子';mb.disabled=false}
  else if(G.phase==='done'){mb.textContent='結束回合';mb.disabled=false}
  else{mb.textContent='…';mb.disabled=true}
  const tot=G.players.reduce((t,q)=>t+Math.max(0,q.out?0:worth(q)),0)||1;
  $('#players').innerHTML=G.players.map((q,i)=>{const w=worth(q);return `<button class="pc ${i===G.turn&&!G.over?'now':''} ${q.out?'out':''}" data-p="${i}">
    ${i===G.turn&&!G.over?'<span class="tag">輪到</span>':''}
    <span class="top"><span class="av" style="background:${q.color}">${esc([...q.name][0]||'?')}</span><span class="who2">
    <span class="nm">${esc(q.name)}${q.bot?'<em>電腦</em>':''}${G.online&&!q.bot&&q.uid===NET.uid?'<em>你</em>':''}${q.out?'<em>破產</em>':''}</span>
    <span class="job">${JOBS[q.job][0]}${q.skip?'・出國中':''}</span></span></span>
    <span class="row"><span>現金</span><span class="num">${fmt(q.cash)}</span></span>
    <span class="row"><span>總資產</span><span class="num"><b>${fmt(w)}</b></span></span>
    <span class="bar" title="占全場資產比例"><i style="width:${q.out?0:Math.max(2,Math.round(Math.max(0,w)/tot*100))}%;background:${q.color}"></i></span></button>`}).join('');
  if(lastFx!==undefined&&(G.fx||0)>lastFx)confetti();lastFx=G.fx||0;
  $('#ticker').innerHTML=(()=>{const one=AK.map(k=>{const ch=(G.prices[k]/G.prev[k]-1)*100;return `<span>${ASSETS[k].n} <b class="num">${fmt(G.prices[k])}</b> <em class="${ch>=0?'up':'dn'}">${ch>=0?'▲':'▼'}${Math.abs(ch).toFixed(1)}%</em></span>`}).join('');return one+one})();
  const key=G.gid||'local';
  G.players.forEach((q,i)=>{const prev=lastCash[key+':'+i];lastCash[key+':'+i]=q.cash;
    if(prev!==undefined&&prev!==q.cash){const d=q.cash-prev,el=document.createElement('span');el.className='float '+(d>0?'gain':'loss');el.textContent=(d>0?'+':'-')+fmt(Math.abs(d)).replace('-','');$('#players').children[i]?.appendChild(el)}});
  $('#log').innerHTML=G.log.slice(0,40).map(l=>`<li><i style="background:${l.c}"></i><span>${esc(l.t)}</span></li>`).join('');
  persist();
}
$('#mainBtn').addEventListener('click',()=>{if(!G)return;if(G.over)return showResults();if(cur().bot||!drivingNow())return;if(G.phase==='roll')doRoll();else if(G.phase==='done')endTurn()});
$('#actBtn').addEventListener('click',async()=>{
  if(!G||G.over)return;const p=cur();if(p.bot||!drivingNow()||G.phase!=='done')return;
  const i=p.pos,o=G.own[i];
  if(B[i].t==='bank'){await bankLoop(p,true);G.phase='done';render();return}
  if(!o||o.p===p.id)await propOffer(p,i);else if(!G.negDone)await negotiate(p,G.players[o.p],i);
  G.phase='done';render();
});
$('#mktBtn').addEventListener('click',()=>G&&openMarket());
$('#bankBtn').addEventListener('click',async()=>{
  if(!G||G.over)return;const p=cur();
  if(p.bot||!drivingNow()||!(G.phase==='roll'||G.phase==='done')){openSheet('手機網銀','<p>輪到你的回合時才能用網銀借錢、還錢。</p>',[],true);return}
  const ph=G.phase;await bankLoop(p,atCounter(p));G.phase=ph;render();
});
$('#meBtn').addEventListener('click',()=>{if(!G)return;openAssets(meP()||cur())});
$('#players').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)openAssets(G.players[+b.dataset.p])});
$('#rulesBtn').addEventListener('click',showRules);
$('#newBtn').addEventListener('click',()=>{if(G&&!G.over&&!G.demo)openQuit();else showSetup()});

function resume(){
  if(G.seq===undefined)G.seq=0;
  render();
  if(G.phase==='start'){maybeStart();return}
  if(G.over){showResults();return}
  const p=cur();
  if(G.phase==='roll'){if(p.bot)doRoll()}
  else{G.phase='done';render();if(p.bot)endTurn()}
}
function start(data){
  buildBoard();
  let saved=data&&data.G;
  if(!saved){try{saved=JSON.parse(localStorage.getItem('tw-tycoon-v1')||'null')}catch(e){}}
  if(saved&&saved.players&&!saved.online&&!saved.abandoned&&!saved.demo){G=saved;resume()}
  else{
    G=null;
    // sample frame behind the setup sheet
    const demo={players:[{name:'我',bot:false},{name:'阿財',bot:true},{name:'小美',bot:true}],rounds:20};
    newGame(demo);G.demo=true;G.msg='設定玩家後就能開始。';render();
    showSetup();
  }
  initNet();
}
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
