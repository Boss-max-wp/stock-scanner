name: 每日選股

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["news.json", "scan.js", "patterns/**", "checkin/**", "trip/**", "vocab/**", "life/**", ".github/workflows/scan.yml"]   # 新聞或程式更新時自動重建網頁

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 讀取資料快取
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: bars-${{ github.run_id }}
          restore-keys: bars-
      - name: 抓資料並跑選股
        run: node scan.js
      - name: 儲存資料快取
        if: always() && hashFiles('.cache/bars.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: bars-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 放入打卡本
        run: mkdir -p public && cp -r checkin public/checkin && cp -r trip public/trip && cp -r vocab public/vocab && cp -r life public/life && cp -r house public/house
      - name: 人生資產模擬器：抓今天的真實行情
        continue-on-error: true
        run: node life/update-prices.mjs life/prices.json public/life/prices.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
