name: 每日選股

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["news.json", "scan.js", "patterns/**", ".github/workflows/scan.yml"]   # 新聞或程式更新時自動重建網頁

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓資料並跑選股
        run: node scan.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
