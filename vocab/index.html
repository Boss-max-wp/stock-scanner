<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>單字填空機</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: exam answer sheet — word list on the left, one question card on the right; stacks on phones */
:root{
  --bg:#EEF1F4; --paper:#FFFFFF; --ink:#1B2433; --muted:#5E6878; --line:#D3D9E1;
  --accent:#E2A400; --accent-soft:#FFF3CC; --good:#1F7A50; --good-soft:#E3F4EA; --bad:#B8382F; --bad-soft:#FBE7E5;
  --f-read:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161D; --paper:#1A2029; --ink:#E6EAF0; --muted:#9AA4B2; --line:#2D3642;
  --accent:#F2B92B; --accent-soft:#3A3014; --good:#5CCB95; --good-soft:#163226; --bad:#F2786E; --bad-soft:#3A1E1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161D; --paper:#1A2029; --ink:#E6EAF0; --muted:#9AA4B2; --line:#2D3642;
  --accent:#F2B92B; --accent-soft:#3A3014; --good:#5CCB95; --good-soft:#163226; --bad:#F2786E; --bad-soft:#3A1E1C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--f-read);font-weight:600;font-size:2rem;margin:0;letter-spacing:-.01em}
h1 span{background:linear-gradient(transparent 62%,var(--accent) 62%);padding-inline:2px}
header p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:500}
textarea{width:100%;min-height:200px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);color:var(--ink);font-family:var(--f-mono);font-size:.92rem;line-height:1.7}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:10px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1B2433;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:.85rem;color:var(--muted);min-height:1.4em;margin:0}
.status.err{color:var(--bad)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.qno{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.badge{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sentence{font-family:var(--f-read);font-size:1.45rem;line-height:1.75;margin:0;overflow-wrap:anywhere}
.blank{font-family:var(--f-mono);font-size:1.05rem;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);padding:0 4px;width:9ch;text-align:center;border-radius:0}
.blank.ok{border-color:var(--good);color:var(--good)}
.blank.no{border-color:var(--bad);color:var(--bad)}
.gap{display:inline-block;min-width:7ch;border-bottom:2px solid var(--ink);text-align:center;font-family:var(--f-mono);font-size:1.05rem}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:460px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{text-align:left;font-family:var(--f-read);font-size:1.1rem;padding:10px 14px}
.opt b{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin-right:8px}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.tip{background:var(--accent-soft)}
.fb strong{font-size:1rem}
.fb .zh{color:var(--muted);font-size:.92rem}
.word{font-family:var(--f-read);font-weight:600;font-size:1.05rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.score{font-family:var(--f-read);font-size:3rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.wrong{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wrong li{border-bottom:1px solid var(--line);padding-bottom:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.example{font-size:.8rem;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
input.key{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);font-family:var(--f-mono);font-size:.85rem}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:.85rem;color:var(--muted)}
details[open] summary{margin-bottom:8px}
.hint a{color:var(--ink)}
.unitrow{display:flex;gap:8px}
select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);font:inherit}
.btn.sm{padding:8px 10px;white-space:nowrap}
.btn.photo{text-align:center;display:block}
.btn.photo[aria-disabled="true"]{opacity:.5;pointer-events:none}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:.82rem;cursor:pointer;align-self:flex-start;text-decoration:underline}
.linkbtn.warn{color:var(--bad);font-weight:700}
.linkbtn[hidden]{display:none}
[hidden]{display:none!important}
body{margin:0;-webkit-text-size-adjust:100%}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:0 0 auto;border:0;background:transparent;font:inherit;font-weight:500;padding:8px 14px;border-radius:8px;color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.unitlist{display:flex;flex-direction:column;gap:6px}
.unititem{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;width:100%}
.unititem[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.unititem span:first-child{min-width:0;overflow-wrap:anywhere}
.count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
input.uname{font-family:var(--f-read);font-size:1.5rem;font-weight:600;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:2px 0;width:100%;border-radius:0}
.seg.small button{padding:5px 10px;font-size:.85rem}
.vocab{list-style:none;margin:0;padding:0}
.vocab li{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.2fr);gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-radius:6px;transition:background .2s}
.vocab li.speaking{background:var(--accent-soft)}
.say{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.say:hover{border-color:var(--muted)}
.say svg{width:18px;height:18px}
.player{align-items:center}
.player select{width:auto;flex:none}
@media (prefers-reduced-motion:reduce){.vocab li{transition:none}}
.vocab li.empty{display:block;cursor:default;color:var(--muted);border:0}
.vocab .en{font-family:var(--f-read);font-size:1.15rem;font-weight:600;overflow-wrap:anywhere}
.vocab .zh{overflow-wrap:anywhere}
.vocab .zh.none{color:var(--muted);font-size:.85rem}
.vocab .hide{color:transparent;background:var(--line);border-radius:4px;user-select:none}
.vocab li.show .hide{color:inherit;background:none}
.checks{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.check input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.check span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.bigword{font-family:var(--f-read);font-size:2.6rem;font-weight:600;margin:0;line-height:1.2;overflow-wrap:anywhere}
.opt.zh{font-family:var(--f-ui);font-size:1rem}
select.n{flex:none;width:100%}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><span>單字填空機</span></h1>
    <p>多益單字：分單元複習，再用填空題和英翻中練習。</p>
  </header>

  <nav class="tabs" aria-label="頁面">
    <button type="button" data-page="units">單元複習</button>
    <button type="button" data-page="cloze">填空題</button>
    <button type="button" data-page="meaning">英翻中</button>
  </nav>

  <!-- 單元 -->
  <section id="p-units" class="grid">
    <aside class="panel">
      <div class="label">我的單元</div>
      <div id="unitlist" class="unitlist"></div>
      <button id="addunit" class="btn" type="button">＋ 新單元</button>
      <details id="keybox">
        <summary>Gemini 金鑰設定</summary>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label class="label" for="key">Gemini API 金鑰</label>
          <input id="key" class="key" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…">
          <p class="hint">拍照抓單字、出填空題、補中文都會用到 Google 的 Gemini（免費）。到 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> 用 Google 帳號登入、按「建立 API 金鑰」，複製貼在這裡。金鑰只存在這台裝置的瀏覽器。</p>
        </div>
      </details>
    </aside>

    <div class="card">
      <input id="uname" class="uname" aria-label="單元名稱" placeholder="單元名稱，例如 Unit 3 Office">
      <div class="meta">
        <span id="ucount" class="count"></span>
        <div class="seg small" role="group" aria-label="複習方式">
          <button type="button" data-mask="none">全部顯示</button>
          <button type="button" data-mask="zh">遮中文</button>
          <button type="button" data-mask="en">遮英文</button>
        </div>
      </div>
      <div id="player" class="row player">
        <button id="playall" class="btn primary" type="button">全部念一遍</button>
        <div class="seg small" role="group" aria-label="念的內容">
          <button type="button" data-read="both">英文＋中文</button>
          <button type="button" data-read="en">只念英文</button>
        </div>
        <select id="rate" aria-label="念的速度"><option value="0.7">慢速</option><option value="0.9">正常</option><option value="1.1">快速</option></select>
      </div>
      <ul id="vocab" class="vocab"></ul>
      <p id="maskhint" class="hint">點一下那一行，就會顯示被遮住的部分。</p>
      <div class="row">
        <label class="btn photo" for="photo" id="photolabel">拍照 / 選照片加單字</label>
        <input id="photo" type="file" accept="image/*" multiple hidden>
        <button id="editbtn" class="btn" type="button">編輯單字</button>
        <button id="fillzh" class="btn" type="button" hidden>補上缺的中文</button>
      </div>
      <div id="editbox" hidden style="display:flex;flex-direction:column;gap:8px">
        <label class="label" for="words">一行一個單字，後面可以接中文，例如「postpone 延後」</label>
        <textarea id="words" spellcheck="false" placeholder="postpone 延後&#10;budget 預算&#10;reimburse 報銷"></textarea>
        <button id="editdone" class="btn primary" type="button" style="align-self:flex-start">完成</button>
      </div>
      <p id="st-units" class="status" role="status"></p>
      <button id="delunit" class="linkbtn" type="button">刪除這個單元</button>
    </div>
  </section>

  <!-- 填空題 -->
  <section id="p-cloze" class="grid" hidden>
    <aside class="panel">
      <div class="label">要考哪些單元</div>
      <div id="sel-cloze" class="checks"></div>
      <div class="row"><button class="linkbtn" type="button" data-all="cloze">全選</button><button class="linkbtn" type="button" data-none="cloze">全不選</button></div>
      <label class="label" for="n-cloze">題數</label>
      <select id="n-cloze" class="n"><option value="10">10 題</option><option value="20">20 題</option><option value="30">30 題</option><option value="60">全部（最多 60 題）</option></select>
      <div class="label">作答方式</div>
      <div class="seg" role="group" aria-label="作答方式">
        <button id="m-choice" type="button" aria-pressed="true">四選一</button>
        <button id="m-type" type="button" aria-pressed="false">自己拼</button>
      </div>
      <button id="gen-cloze" class="btn primary" type="button">出題</button>
      <p id="st-cloze" class="status" role="status"></p>
    </aside>
    <section id="stage-cloze" class="card" aria-live="polite"></section>
  </section>

  <!-- 英翻中 -->
  <section id="p-meaning" class="grid" hidden>
    <aside class="panel">
      <div class="label">要考哪些單元</div>
      <div id="sel-meaning" class="checks"></div>
      <div class="row"><button class="linkbtn" type="button" data-all="meaning">全選</button><button class="linkbtn" type="button" data-none="meaning">全不選</button></div>
      <label class="label" for="n-meaning">題數</label>
      <select id="n-meaning" class="n"><option value="10">10 題</option><option value="20">20 題</option><option value="30">30 題</option><option value="999">全部</option></select>
      <button id="gen-meaning" class="btn primary" type="button">開始</button>
      <p class="hint">看英文，從四個中文意思選出正確的。用的是單元裡的中文；沒有中文的單字會先用 Gemini 補上。</p>
      <p id="st-meaning" class="status" role="status"></p>
    </aside>
    <section id="stage-meaning" class="card" aria-live="polite"></section>
  </section>
</div>

<script>
const EXAMPLE = [
 {word:"postpone",answer:"postponed",pos:"v.",meaning:"延後",sentence:"Due to the heavy rain, the outdoor company picnic has been ____ until next Saturday.",zh:"由於大雨，公司戶外野餐已延到下週六。",options:["postponed","reimbursed","negotiated","budgeted"]},
 {word:"budget",answer:"budget",pos:"n.",meaning:"預算",sentence:"The marketing team must keep all campaign expenses within the approved ____ for this quarter.",zh:"行銷團隊必須把所有活動支出控制在本季核准的預算內。",options:["budget","inventory","agenda","receipt"]},
 {word:"reimburse",answer:"reimbursed",pos:"v.",meaning:"報銷；償還",sentence:"Employees will be ____ for travel expenses once they submit their receipts to accounting.",zh:"員工把收據交給會計後，差旅費就會獲得報銷。",options:["reimbursed","postponed","assigned","refunded"]},
 {word:"mandatory",answer:"mandatory",pos:"adj.",meaning:"強制的；必須的",sentence:"Attendance at Friday's safety training session is ____ for all warehouse staff.",zh:"所有倉庫人員都必須參加週五的安全訓練。",options:["mandatory","optional","temporary","punctual"]},
 {word:"negotiate",answer:"negotiate",pos:"v.",meaning:"談判；協商",sentence:"Ms. Chen hopes to ____ a lower price with the supplier before signing the new contract.",zh:"陳小姐希望在簽新合約前和供應商談到更低的價格。",options:["negotiate","postpone","purchase","announce"]},
 {word:"inventory",answer:"inventory",pos:"n.",meaning:"存貨；庫存清單",sentence:"The store closes early on the last day of each month so staff can count the ____.",zh:"這家店每月最後一天提早打烊，讓員工盤點存貨。",options:["inventory","invoice","budget","itinerary"]}
];

const $ = s => document.querySelector(s);
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function loadJSON(k,d){try{const v=JSON.parse(load(k)||"null");return v??d}catch(e){return d}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const norm = s => String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setSt(id,t,err){const el=$("#st-"+id);el.textContent=t||"";el.classList.toggle("err",!!err)}
const newId=()=>"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* ---------- 單字解析：一行「英文 中文」 ---------- */
const CJK=/[\u3400-\u9fff\u3000-\u303f\uff00-\uffef]/;
function parseEntries(text){
  const out=[], seen=new Set();
  for(const line of String(text||"").split(/\n+/)){
    const parts = CJK.test(line) ? [line] : line.split(/[,;]+/);
    for(const part of parts){
      const t=part.trim();
      const m=t.match(/^[A-Za-z][A-Za-z'\- ]*[A-Za-z]|^[A-Za-z]/);
      if(!m) continue;
      const word=m[0].replace(/\s+/g," ").trim(), key=word.toLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      const zh=t.slice(m[0].length).replace(/^[\s:：=\-–—]+/,"").trim();
      out.push({word,zh});
    }
  }
  return out;
}
const parseWords = t => parseEntries(t).map(e=>e.word);

/* ---------- 單元 ---------- */
let units=loadJSON("vc-units",null);
if(!Array.isArray(units)||!units.length){
  const legacy=load("vc-words");
  units=[{id:newId(),name:legacy?"單元 1":"範例單元",words:legacy ?? EXAMPLE.map(q=>q.word+" "+q.meaning).join("\n")}];
}
let cur=load("vc-cur"); if(!units.some(u=>u.id===cur)) cur=units[0].id;
let mask=load("vc-mask")||"none";
const unit=()=>units.find(u=>u.id===cur);
const unitById=id=>units.find(u=>u.id===id);
function saveUnits(){store("vc-units",JSON.stringify(units));store("vc-cur",cur)}

const nameEl=$("#uname"), wordsEl=$("#words"), delBtn=$("#delunit");
function drawUnitList(){
  $("#unitlist").innerHTML=units.map(u=>`<button type="button" class="btn unititem" data-id="${u.id}" aria-current="${u.id===cur}"><span>${esc(u.name||"未命名單元")}</span><span class="count">${parseEntries(u.words).length} 字</span></button>`).join("");
}
function drawVocab(){
  const es=parseEntries(unit().words);
  $("#ucount").textContent=`${es.length} 個單字`;
  stopSpeaking();
  $("#vocab").innerHTML = es.length ? es.map((e,i)=>`<li data-i="${i}">${TTS_OK?`<button class="say" type="button" aria-label="念 ${esc(e.word)}">${SPEAKER}</button>`:"<span></span>"}<span class="en ${mask==="en"?"hide":""}">${esc(e.word)}</span><span class="zh ${e.zh?"":"none"} ${mask==="zh"&&e.zh?"hide":""}">${e.zh?esc(e.zh):"（還沒有中文）"}</span></li>`).join("")
    : `<li class="empty">這個單元還沒有單字。按「拍照 / 選照片加單字」，或「編輯單字」自己打。</li>`;
  $("#maskhint").hidden = mask==="none" || !es.length;
  document.querySelectorAll("[data-mask]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mask===mask));
  $("#fillzh").hidden = !es.some(e=>!e.zh);
}
function drawUnit(){
  drawUnitList();

const SPEAKER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const TTS_OK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if(TTS_OK){loadVoices(); try{speechSynthesis.addEventListener("voiceschanged",loadVoices)}catch(e){}}
function pickVoice(lang){
  const L=lang.toLowerCase(), base=L.slice(0,2);
  const by=f=>voices.find(v=>f(String(v.lang).toLowerCase().replace("_","-")));
  return by(l=>l===L) || (base==="zh"? by(l=>l==="zh-tw"||l.includes("hant")) || by(l=>l.startsWith("zh")) : by(l=>l.startsWith(base)));
}

function mark(i){document.querySelectorAll("#vocab li.speaking").forEach(x=>x.classList.remove("speaking")); if(i==null) return; const li=document.querySelector(`#vocab li[data-i="${i}"]`); if(li){li.classList.add("speaking"); if(playing) li.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}}
function utter(text,lang){const u=new SpeechSynthesisUtterance(text);u.lang=lang;const v=pickVoice(lang);if(v)u.voice=v;u.rate=Number(rateEl.value)||0.9;return u}
function stopSpeaking(){ if(!TTS_OK) return; playing=false; try{speechSynthesis.cancel()}catch(e){} mark(null); const b=$("#playall"); if(b) b.textContent="全部念一遍"; }
function speak(list,all){
  stopSpeaking();
  if(!list.length) return;
  playing=all;
  if(all) $("#playall").textContent="停止";
  const queue=[];
  list.forEach(({e,i})=>{
    const a=utter(e.word,"en-US"); a.onstart=()=>mark(i); queue.push(a);
    if(readMode==="both"&&e.zh){queue.push(utter(e.zh.replace(/[；;／/]/g,"，"),"zh-TW"))}
  });
  const last=queue[queue.length-1];
  const done=()=>{ if(last.__done) return; last.__done=true; playing=false; mark(null); $("#playall").textContent="全部念一遍"; };
  last.onend=done; last.onerror=done;
  queue.forEach(u=>speechSynthesis.speak(u));
}

const keyEl=$("#key");

const MODELS=["gemini-3.5-flash-lite","gemini-3.8-flash"];
async function gemini(text,key,images=[],temperature=0.9){
  let last;
  for(const model of MODELS){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
      method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},
      body:JSON.stringify({contents:[{role:"user",parts:[...images.map(data=>({inlineData:{mimeType:"image/jpeg",data}})),{text}]}],generationConfig:{responseMimeType:"application/json",temperature}})
    }).catch(()=>null);
    if(!r){last={code:"network"};continue}
    const j=await r.json().catch(()=>({}));
    if(r.ok){
      const out=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
      try{return JSON.parse(out)}catch(e){const m=out.match(/\[[\s\S]*\]/);if(m)try{return JSON.parse(m[0])}catch(_){} throw {code:"invalid_json"}}
    }
    const msg=JSON.stringify(j);
    if(r.status===404){last={code:"model"};continue}
    if(/API_KEY_INVALID|API key not valid/i.test(msg)) throw {code:"bad_key"};
    if(r.status===429) throw {code:"rate_limited"};
    if(r.status===403) throw {code:"forbidden"};
    last={code:"upstream",status:r.status};
  }
  throw last||{code:"upstream"};
}

  bad_key:"Gemini 金鑰不正確，請到「單元複習」頁左下的「Gemini 金鑰設定」重新貼一次。",
  forbidden:"這組金鑰沒有權限使用 Gemini，請到 AI Studio 重新建立一組。",

};

/* 補中文：把缺中文的單字交給 Gemini，寫回單元 */
async function fillMeanings(unitList,key,page){
  const missing=[...new Set(unitList.flatMap(u=>parseEntries(u.words).filter(e=>!e.zh).map(e=>e.word)))];
  if(!missing.length) return 0;
  const got=new Map();
  for(let i=0;i<missing.length;i+=40){
    setSt(page,`正在補中文意思…（${Math.min(i+40,missing.length)} / ${missing.length}）`);
    const chunk=missing.slice(i,i+40);
    const arr=await gemini(`Give a short Traditional Chinese (Taiwan) meaning for each English word or phrase below, as used in TOEIC / business English. Keep each meaning under 12 characters; use ；to separate two senses.
Reply with only a JSON array in the same order, like [{"word":"postpone","zh":"延後"}].

${chunk.join("\n")}`,key,[],0.2);
    if(Array.isArray(arr)) arr.forEach((it,k)=>{const zh=String(it?.zh||"").trim(); if(zh) got.set(norm(it?.word||chunk[k]),zh)});
  }
  let n=0;
  for(const u of unitList){
    const es=parseEntries(u.words);
    if(!es.some(e=>!e.zh&&got.has(norm(e.word)))) continue;
    u.words=es.map(e=>{if(!e.zh&&got.has(norm(e.word))){n++;return `${e.word} ${got.get(norm(e.word))}`}return e.zh?`${e.word} ${e.zh}`:e.word}).join("\n");
  }
  saveUnits();
  return n;
}
$("#fillzh").onclick=async()=>{
  const key=getKey("units"); if(!key) return;
  const b=$("#fillzh"); b.disabled=true;
  try{const n=await fillMeanings([unit()],key,"units"); setSt("units",`補好 ${n} 個中文意思，請看一下對不對。`); drawUnit()}
  catch(e){setSt("units",errMsg(e),true)}
  finally{b.disabled=false}
};

/* 拍照抓單字 */
const PHOTO_PROMPT=`This photo shows a page from an English textbook, vocabulary book or word list used by a Taiwanese learner preparing for the TOEIC.
Find the English vocabulary words and phrases the page is teaching: headwords, bold or highlighted words, word lists, glossary entries. Skip page numbers, instructions, people's names, and ordinary words that only appear inside example sentences. Keep phrases (e.g. "take over") together, in dictionary form as printed.
If a Chinese meaning is printed next to a word, use it; otherwise give a short Traditional Chinese (Taiwan) meaning.
Reply with only a JSON array in page order, like [{"word":"postpone","zh":"延後"}]. Reply [] if no vocabulary is visible.`;
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.85).split(",")[1];
  }finally{URL.revokeObjectURL(url)}
}
const photoEl=$("#photo"), photoLabel=$("#photolabel");
photoEl.onchange=async()=>{
  const files=[...photoEl.files]; photoEl.value="";
  if(!files.length) return;
  const key=getKey("units"); if(!key) return;
  const u=unit();
  photoLabel.setAttribute("aria-disabled","true");
  let added=0, dup=0, failed=0;
  try{
    for(let i=0;i<files.length;i++){
      setSt("units",`正在讀第 ${i+1} / ${files.length} 張照片…`);
      let data;
      try{data=await shrink(files[i])}catch(e){failed++;continue}
      let arr;
      try{arr=await gemini(PHOTO_PROMPT,key,[data],0.2)}
      catch(e){if(["bad_key","forbidden","rate_limited","network","model"].includes(e?.code)) throw e; failed++; continue}
      if(!Array.isArray(arr)){failed++;continue}
      const have=new Set(parseWords(u.words).map(w=>w.toLowerCase()));
      const lines=[];
      for(const it of arr){
        const w=parseWords(String(it?.word||""))[0]; if(!w) continue;
        if(have.has(w.toLowerCase())){dup++;continue}
        have.add(w.toLowerCase()); lines.push(it.zh?`${w} ${String(it.zh).trim()}`:w); added++;
      }
      if(lines.length){u.words=(u.words.trim()?u.words.replace(/\s*$/,"\n"):"")+lines.join("\n");saveUnits();if(unit()===u) drawUnit()}
    }
    let msg=added?`從照片抓到 ${added} 個新單字，已加到「${u.name}」。請檢查一下有沒有抓錯，錯的可以按「編輯單字」改。`:"照片裡沒有找到新的單字。";
    if(dup) msg+=`另有 ${dup} 個已經在清單裡。`;
    if(failed) msg+=`有 ${failed} 張照片讀取失敗，可以換一張比較清楚的再試。`;
    setSt("units",msg,!added&&failed>0);
  }catch(e){setSt("units",errMsg(e)+(added?`（已先加入 ${added} 個單字）`:""),true)}
  finally{photoLabel.removeAttribute("aria-disabled");drawUnit()}
};

function pickEntries(kind){
  const us=selected(kind).map(unitById);
  const seen=new Set(), out=[];
  for(const u of us) for(const e of parseEntries(u.words)){const k=e.word.toLowerCase(); if(!seen.has(k)){seen.add(k);out.push({...e,unit:u.name})}}
  return {us,entries:out};
}

/* ---------- 題目進行（兩種題型共用） ---------- */
let clozeMode=load("vc-mode")==="type"?"type":"choice";
function makeRunner(kind){
  const stage=$("#stage-"+kind);
  const S={items:[],idx:0,results:[],example:false,answered:false};
  function start(items,example){S.items=items;S.idx=0;S.results=[];S.example=example;render()}
  function head(){
    const q=S.items[S.idx];
    return `<div class="meta"><span class="qno">第 ${S.idx+1} / ${S.items.length} 題</span>
      <span>${S.example?'<span class="example">範例題目 · </span>':""}${q.pos?`<span class="badge">${esc(q.pos)}</span>`:q.unit?`<span class="example">${esc(q.unit)}</span>`:""}</span></div>
      <div class="bar"><i style="width:${S.idx/S.items.length*100}%"></i></div>`;
  }
  function render(){
    S.answered=false;
    const q=S.items[S.idx];
    if(kind==="meaning"){
      stage.innerHTML=head()+`<div class="label">這個字是什麼意思？</div><p class="bigword" lang="en">${esc(q.word)}</p>
        <div class="opts">${shuffle(q.options).map((o,i)=>`<button class="btn opt zh" data-v="${esc(o)}" type="button"><b>${i+1}</b>${esc(o)}</button>`).join("")}</div>
        <div id="fb-${kind}"></div><div class="actions"></div>`;
    }else{
      const parts=q.sentence.split("____");
      const blank=clozeMode==="type"
        ? `<input class="blank" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="填入答案" style="width:${Math.max(7,q.answer.length+2)}ch">`
        : `<span class="gap" id="gap">&nbsp;</span>`;
      stage.innerHTML=head()+`<p class="sentence" lang="en">${esc(parts[0])}${blank}${esc(parts.slice(1).join("____"))}</p>
        ${clozeMode==="choice"?`<div class="opts">${shuffle(q.options).map((o,i)=>`<button class="btn opt" data-v="${esc(o)}" type="button"><b>${"ABCD"[i]}</b>${esc(o)}</button>`).join("")}</div>`:""}
        <div id="fb-${kind}"></div>
        <div class="actions"><button class="btn" id="hint" type="button">提示</button>${clozeMode==="type"?'<button class="btn primary" id="go" type="button">送出</button>':""}</div>`;
      stage.querySelector("#hint").onclick=()=>{ if(S.answered) return;
        stage.querySelector("#fb-cloze").innerHTML=`<div class="fb tip"><span>開頭是 <strong>${esc(q.answer[0])}</strong>，共 ${q.answer.replace(/\s/g,"").length} 個字母 · 意思：${esc(q.meaning)}</span></div>`};
      if(clozeMode==="type"){
        const inp=stage.querySelector("#ans"); inp.focus({preventScroll:true});
        inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();S.answered?next():check(inp.value)}});
        stage.querySelector("#go").onclick=()=>S.answered?next():check(inp.value);
      }
    }
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(!S.answered) check(b.dataset.v,b)});
  }
  function check(val,btn){
    const q=S.items[S.idx];
    if(kind==="cloze"&&clozeMode==="type"&&!String(val).trim()) return;
    S.answered=true;
    const right = kind==="meaning"?q.zh:q.answer;
    const ok = norm(val)===norm(right);
    S.results.push({q,ok,given:val});
    const nextLabel=S.idx+1<S.items.length?"下一題":"看結果";
    if(kind==="cloze"&&clozeMode==="type"){
      const inp=stage.querySelector("#ans"); inp.classList.add(ok?"ok":"no"); inp.readOnly=true;
      const go=stage.querySelector("#go"); go.textContent=nextLabel; go.focus({preventScroll:true});
    }else{
      if(kind==="cloze") stage.querySelector("#gap").textContent=q.answer;
      stage.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(norm(b.dataset.v)===norm(right))b.classList.add("ok")});
      if(!ok&&btn) btn.classList.add("no");
      const nb=document.createElement("button");nb.className="btn primary";nb.type="button";nb.textContent=nextLabel;nb.onclick=next;
      stage.querySelector(".actions").append(nb); nb.focus({preventScroll:true});
    }
    const h=stage.querySelector("#hint"); if(h) h.hidden=true;
    const fb=stage.querySelector("#fb-"+kind);
    if(kind==="meaning"){
      fb.innerHTML=`<div class="fb ${ok?"ok":"no"}"><strong>${ok?"答對了":"答錯了"}</strong><span><span class="word">${esc(q.word)}</span>：${esc(q.zh)}</span></div>`;
    }else{
      const close=!ok&&norm(val)===norm(q.word);
      fb.innerHTML=`<div class="fb ${ok?"ok":"no"}"><strong>${ok?"答對了":close?"差一點：要注意詞形變化":"答錯了"}</strong>
        <span>正確答案：<span class="word">${esc(q.answer)}</span>${norm(q.answer)!==norm(q.word)?`（原形 ${esc(q.word)}）`:""} · ${esc(q.pos)} ${esc(q.meaning)}</span>
        <span class="zh">${esc(q.zh)}</span></div>`;
    }
  }
  function next(){S.idx++; S.idx<S.items.length?render():finish()}
  function finish(){
    const right=S.results.filter(r=>r.ok).length, wrong=S.results.filter(r=>!r.ok);
    const mean=r=>kind==="meaning"?r.q.zh:`${r.q.pos} ${r.q.meaning}`;
    stage.innerHTML=`<div class="meta"><span>${S.example?"範例題目練習結果":"練習結果"}</span></div>
      <div class="bar"><i style="width:100%"></i></div>
      <div><div class="score">${right} / ${S.results.length}</div><p class="hint">答對率 ${Math.round(right/S.results.length*100)}%</p></div>
      ${wrong.length?`<div class="label">要再複習的單字</div><ul class="wrong">${wrong.map(r=>`<li><span class="word">${esc(r.q.word)}</span><span>${esc(mean(r))}</span><span class="hint">你選：${esc(r.given)}</span></li>`).join("")}</ul>`:'<p>全部答對，可以換其他單元了。</p>'}
      <div class="actions">
        ${wrong.length?'<button class="btn" data-act="redo" type="button">只練錯的</button>':""}
        <button class="btn" data-act="again" type="button">整份再做一次</button>
        ${wrong.length&&kind==="cloze"?'<button class="btn primary" data-act="fresh" type="button">錯的單字換新句子</button>':""}
      </div>`;
    stage.querySelector('[data-act="again"]').onclick=()=>start(shuffle(S.items),S.example);
    if(wrong.length){
      stage.querySelector('[data-act="redo"]').onclick=()=>start(shuffle(wrong.map(r=>r.q)),S.example);
      const f=stage.querySelector('[data-act="fresh"]'); if(f) f.onclick=()=>generateCloze(wrong.map(r=>r.q.word));
    }
  }
  function onKey(e){
    if(e.target.matches("input,textarea,select")) return;
    if(e.key==="Enter"&&S.answered){const b=stage.querySelector(".actions .primary");if(b){e.preventDefault();b.click()}return}
    const opts=[...stage.querySelectorAll(".opt:not(:disabled)")];
    const i="1234".indexOf(e.key)>=0?"1234".indexOf(e.key):"abcd".indexOf(e.key.toLowerCase());
    if(e.key.length===1&&i>=0&&opts[i]){e.preventDefault();opts[i].click()}
  }
  return {start,render,S,onKey};
}

function clean(q,word){
  if(!q||typeof q!=="object") return null;
  let answer=String(q.answer||word||"").trim(), sentence=String(q.sentence||"");
  if(!answer||!sentence) return null;
  if(!/_{2,}/.test(sentence)){
    const re=new RegExp("\\b"+answer.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
    if(!re.test(sentence)) return null;
    sentence=sentence.replace(re,"____");
  }
  sentence=sentence.replace(/_{2,}/,"____");
  let options=Array.isArray(q.options)?q.options.map(String).filter(Boolean):[];
  if(!options.some(o=>norm(o)===norm(answer))) options=[answer,...options];
  options=[...new Map(options.map(o=>[norm(o),o])).values()].slice(0,4);
  return {word:String(q.word||word),answer,sentence,options,pos:String(q.pos||""),meaning:String(q.meaning||""),zh:String(q.zh||"")};
}
function clozePrompt(words){
  return `You write TOEIC-style vocabulary fill-in-the-blank questions for a Taiwanese learner.
For EACH word or phrase below, write ONE natural English sentence (12-24 words) in a workplace, business, travel or daily-life context typical of the TOEIC exam. The sentence must clearly need that word; use an inflected form (e.g. -ed, -s, -ing) when grammar requires it.

Reply with only a JSON array, one object per word, in the same order:
{"word": the word as given, "answer": the exact form used in the sentence, "sentence": the sentence with that form replaced by "____" (four underscores, exactly once), "pos": part of speech like "n.", "v.", "adj.", "adv.", "phr.", "meaning": short meaning in Traditional Chinese (Taiwan), "zh": the full sentence translated into Traditional Chinese (Taiwan), "options": 4 strings — the answer plus 3 wrong choices in the same grammatical form that do NOT fit the sentence (prefer other words from this list)}

Example: {"word":"postpone","answer":"postponed","sentence":"The meeting was ____ until Friday because the manager was sick.","pos":"v.","meaning":"延後","zh":"因為經理生病，會議延到週五。","options":["postponed","reimbursed","negotiated","attended"]}

Words:
${words.join("\n")}`;
}
const genCloze=$("#gen-cloze");
genCloze.onclick=()=>{
  const {us,entries}=pickEntries("cloze");
  if(!us.length){setSt("cloze","請先勾選至少一個單元。",true);return}
  const n=Number($("#n-cloze").value)||10;
  generateCloze(shuffle(entries.map(e=>e.word)).slice(0,Math.min(n,60)));
};
async function generateCloze(words){
  if(!words.length){setSt("cloze","勾選的單元裡還沒有單字。先到「單元複習」加單字。",true);return}
  const key=getKey("cloze"); if(!key) return;
  genCloze.disabled=true;
  const chunks=[]; for(let i=0;i<words.length;i+=15) chunks.push(words.slice(i,i+15));
  const made=[];
  try{
    for(let c=0;c<chunks.length;c++){
      setSt("cloze",`正在出題…（${Math.min((c+1)*15,words.length)} / ${words.length} 個單字）`);
      const arr=await gemini(clozePrompt(chunks[c]),key);
      if(Array.isArray(arr)) arr.forEach((q,i)=>{const x=clean(q,chunks[c][i]); if(x) made.push(x)});
    }
    if(!made.length) throw {code:"invalid_json"};
    runners.cloze.start(shuffle(made),false);
    const skipped=words.length-made.length;
    setSt("cloze",`出好 ${made.length} 題了。`+(skipped>0?`有 ${skipped} 個單字沒成功出題。`:""));
  }catch(e){
    if(made.length){runners.cloze.start(shuffle(made),false);setSt("cloze",`只出好 ${made.length} 題，其餘失敗：`+errMsg(e),true)}
    else setSt("cloze",errMsg(e),true);
  }finally{genCloze.disabled=false}
}

/* ---------- 英翻中 ---------- */
const FILLER=["延後","預算","報銷","強制的","談判","存貨","發票","行程","出席","合約","供應商","部門","申請","維修","退款","折扣","會議","升職","面試","通知","延長","確認","取消","建議","安排"];
function buildMeaning(entries){
  const pool=[...new Set(units.flatMap(u=>parseEntries(u.words).map(e=>e.zh)).filter(Boolean).concat(FILLER))];
  return entries.filter(e=>e.zh).map(e=>{
    const others=shuffle(pool.filter(z=>norm(z)!==norm(e.zh))).slice(0,3);
    return {word:e.word,zh:e.zh,unit:e.unit,options:[e.zh,...others]};
  });
}
const genMeaning=$("#gen-meaning");
genMeaning.onclick=async()=>{
  let {us,entries}=pickEntries("meaning");
  if(!us.length){setSt("meaning","請先勾選至少一個單元。",true);return}
  if(!entries.length){setSt("meaning","勾選的單元裡還沒有單字。先到「單元複習」加單字。",true);return}
  let note="";
  const missing=entries.filter(e=>!e.zh).length;
  if(missing){
    const key=keyEl.value.trim();
    if(key){
      genMeaning.disabled=true;
      try{await fillMeanings(us,key,"meaning"); ({entries}=pickEntries("meaning"))}
      catch(e){note=`有 ${missing} 個單字沒有中文，這次先跳過（${errMsg(e)}）`}
      finally{genMeaning.disabled=false}
    }else note=`有 ${missing} 個單字沒有中文，這次先跳過。設定 Gemini 金鑰後會自動補上。`;
  }
  const n=Number($("#n-meaning").value)||10;
  const items=shuffle(buildMeaning(entries)).slice(0,n);
  if(!items.length){setSt("meaning",note||"沒有可以出題的單字。",true);return}
  runners.meaning.start(items,false);
  setSt("meaning",(note?note+" ":"")+`共 ${items.length} 題。可以用鍵盤 1–4 作答。`,!!note);
};

/* ---------- 分頁 ---------- */
const PAGES=["units","cloze","meaning"];
let page="units";
function show(p){
  if(!PAGES.includes(p)) p="units";
  page=p; store("vc-page",p);
  PAGES.forEach(x=>$("#p-"+x).hidden=x!==p);
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.page===p?"page":"false"));
  if(p==="units") drawUnit(); else drawChecks(p);
  if(location.hash!=="#"+p) history.replaceState(null,"","#"+p);
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>show(b.dataset.page));
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
document.addEventListener("keydown",e=>{if(page!=="units") runners[page].onKey(e)});

setMode(clozeMode);
runners.cloze.start(shuffle(EXAMPLE),true);
setSt("cloze","右邊是範例題目。勾選你的單元後按「出題」。");
runners.meaning.start(shuffle(EXAMPLE).map(q=>({word:q.word,zh:q.meaning,options:[q.meaning,...shuffle(EXAMPLE.filter(x=>x!==q).map(x=>x.meaning)).slice(0,3)]})),true);
setSt("meaning","右邊是範例題目。勾選你的單元後按「開始」。");
show(location.hash.slice(1)||load("vc-page")||"units");
</script>
