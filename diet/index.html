<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飲食熱量日記</title>
<meta name="theme-color" content="#3f8f63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="熱量日記">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233f8f63'/><circle cx='32' cy='34' r='16' fill='none' stroke='white' stroke-width='6'/><path d='M32 10v8' stroke='white' stroke-width='6' stroke-linecap='round'/></svg>">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Phone-first single column. Fresh sage + peach palette, rounded cards, bottom tab bar. */
:root{
  --bg:#f4f6f1; --surface:#ffffff; --ink:#24302a; --muted:#6b776f; --line:#dde3da; --soft:#eef2ea;
  --accent:#3f8f63; --accent-ink:#ffffff; --peach:#e8875b; --good:#2f8a4f; --warn:#c27a00; --bad:#c8402f;
  --display:"Nunito","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a16; --surface:#1c241f; --ink:#e8eee9; --muted:#9aa89e; --line:#2d3830; --soft:#232c26;
  --accent:#5cc28a; --accent-ink:#0d1a12; --peach:#f29a72; --good:#5cc28a; --warn:#f0b43c; --bad:#ff7b6b; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;font-weight:700}
header h1 span{color:var(--accent)}
#sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
#sync.cloud i{background:var(--good)}
main{padding:14px 16px 110px;display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:700}
nav button.plus svg{background:var(--accent);color:var(--accent-ink);border-radius:50%;padding:3px;width:28px;height:28px;margin-top:-4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:18px;margin:0;text-wrap:balance}
.card h3{font-size:15px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--muted);font-family:var(--body);font-weight:400}
.bar{height:9px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.over>div{background:var(--bad)}
.bar.lim>div{background:var(--peach)}
.btn{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-weight:500;border-radius:12px;padding:9px 14px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.full{width:100%;padding:12px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
input[type=checkbox]{width:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 120px}
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{width:118px;height:118px;flex:none}
.ring circle{fill:none;stroke-width:11}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring.over .fg{stroke:var(--bad)}
.ring text{fill:var(--ink);font-family:var(--display);font-weight:800}
.ring text.s{fill:var(--muted);font-family:var(--body);font-weight:400}
.eq{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.eq span:nth-child(odd){color:var(--muted)}
.eq b{font-variant-numeric:tabular-nums;text-align:right}
.nut{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.nut .lab{display:flex;justify-content:space-between;font-size:13px}
.nut .lab span{color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good);color:#fff}
.pill.warn{background:var(--warn);color:#fff}
.pill.bad{background:var(--bad);color:#fff}
.meal{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.meal:first-of-type{border-top:0;padding-top:0}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meal-h b{font-size:15px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 4px 10px;border-left:3px solid var(--soft)}
.li .muted{font-size:12px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{border:0;background:none;font:inherit;font-size:14px;padding:7px 0;border-radius:9px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.g3{grid-template-columns:repeat(3,1fr)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:13px;border-radius:20px;padding:6px 11px;cursor:pointer;text-align:left}
.chip span{color:var(--muted);font-size:12px;margin-left:4px}
.sug{font-size:13px;background:var(--soft);border-left:3px solid var(--peach);padding:7px 10px;border-radius:8px}
.ph-img{width:100%;max-height:240px;object-fit:cover;border-radius:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item.off{opacity:.5}
.item-h{display:flex;gap:8px;align-items:flex-start}
.item-h label{flex:1}
.ngrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ngrid label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.ngrid input{padding:5px 4px;text-align:center;font-size:14px}
label.btn{display:block;text-align:center}
.week{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;gap:2px;align-items:center}
.week .wd{border:0;background:none;font:inherit;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:12px;cursor:pointer;font-size:11px}
.week .wd b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;width:30px;height:30px;line-height:30px;border-radius:50%;text-align:center}
.week .wd.sel b{background:var(--accent);color:var(--accent-ink)}
.week .wd i{width:5px;height:5px;border-radius:50%;background:transparent}
.week .wd.has i{background:var(--peach)}
.week .wd[disabled]{opacity:.35}
.week .nv{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0}
.hero{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .big{font-size:52px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--soft);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.mini svg{width:54px;height:54px}
.mini svg circle{fill:none;stroke-width:6}
.mini .t{font-size:12px;color:var(--muted)}
.mini b{font-variant-numeric:tabular-nums;font-size:14px}
.acts{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.bigbtn{border:0;border-radius:16px;padding:16px 10px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.bigbtn.eat{background:var(--peach);color:#fff}
.bigbtn.mv{background:var(--accent);color:var(--accent-ink)}
.coach{display:flex;gap:10px;align-items:flex-start}
.coach .av{font-size:26px;line-height:1}
.coach .say{flex:1;font-size:15px;font-weight:500}
.coach.roast .say{color:var(--bad)}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none}
.li .main{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.left-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 0 6px 10px}
.chat{display:flex;flex-direction:column;gap:6px;font-size:14px}
.chat .me{align-self:flex-end;background:var(--soft);padding:6px 10px;border-radius:12px 12px 2px 12px;max-width:85%}
.chat .ai{align-self:flex-start;padding:2px 0;max-width:90%}
#streak{font-weight:700;color:var(--peach);font-size:14px;margin-right:auto;margin-left:10px}
.card>label.f,.card>.f{flex:none}
.stat{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:9;display:none;max-width:90vw}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>飲食<span>熱量</span>日記</h1><span id="streak"></span><div id="sync"><i></i><span>本機儲存</span></div></header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<nav id="nav"></nav>
<script>
(function(){
"use strict";
/* ---------- 基本資料 ---------- */
const N=[["k","熱量","kcal"],["p","蛋白質","g"],["c","碳水","g"],["f","脂肪","g"],["fb","膳食纖維","g"],["na","鈉","mg"],["su","糖","g"]];
const MEALS=[["b","早餐",.25],["l","午餐",.35],["d","晚餐",.30],["s","點心",.10]];
const MEALN={b:"早餐",l:"午餐",d:"晚餐",s:"點心"};
const GOALS=[["lose","減脂","少吃一點、吃夠蛋白質，慢慢瘦下來"],["recomp","增肌減脂","小小熱量赤字＋高蛋白＋重訓，體重變化慢，但線條會出來"],["keep","維持","吃跟消耗一樣多，維持現在的體重"],["gain","增肌","多吃一點配合重訓，長肌肉"]];
const GOALN={lose:"減脂",recomp:"增肌減脂",keep:"維持體重",gain:"增肌"};
const PROT={lose:1.6,recomp:2.0,keep:1.2,gain:1.8};
// [名稱, kcal, 蛋白, 碳水, 脂肪, 纖維, 鈉mg, 糖]
const FOODS=[
 ["白飯 1 碗",280,5,62,0.6,0.6,2,0],["糙米飯 1 碗",270,6,56,2,3,4,0],["地瓜 200g",170,3,40,0.3,5,60,12],
 ["燕麥 50g",190,7,33,3.5,5,3,0.5],["全麥吐司 2 片",150,6,26,2,4,260,3],["茶葉蛋",75,7,1,5,0,250,0],
 ["水煮蛋",72,6.5,0.5,5,0,70,0],["超商即食雞胸",110,23,2,1.5,0,550,1],["雞胸肉 100g（熟）",165,31,0,3.6,0,75,0],
 ["燙青菜 1 盤",60,3,5,3,3,300,1],["超商沙拉（不含醬）",80,4,10,2,4,150,4],["無糖豆漿 450ml",145,15,8,6,1.5,30,2],
 ["鮮奶 290ml",180,9,14,10,0,120,14],["無糖希臘優格 100g",60,10,4,0.4,0,40,4],["香蕉 1 根",105,1.3,27,0.4,3,1,14],
 ["蘋果 1 顆",95,0.5,25,0.3,4,2,19],["拿鐵 中杯",190,10,15,10,0,150,15],["珍奶 半糖 大杯",450,5,78,14,0,80,45],
 ["鮪魚飯糰",210,7,35,4.5,1,500,3],["雞腿便當",800,35,95,30,4,1400,6],["排骨便當",850,30,100,35,4,1500,7],
 ["自助餐（2 肉 3 菜＋飯）",750,35,90,28,6,1600,6],["滷肉飯（小）",400,12,55,15,1,700,3],["牛肉麵",650,30,80,20,3,2500,5],
 ["水餃 10 顆",500,20,55,22,3,900,2],["鹹酥雞 1 份",600,25,35,40,1,1200,2],["麥當勞大麥克",530,27,45,27,3,950,9]
];
// [名稱, MET]
const SPORTS=[["走路",3.5],["快走",4.3],["慢跑",7],["跑步（約 10 km/h）",9.8],["騎腳踏車（休閒）",4],["游泳",6],["重量訓練",5],["瑜伽",2.5],["有氧舞蹈／跳舞",6.5],["爬山",6],["羽球",5.5],["籃球",6.5],["飛輪",8.5],["跳繩",11],["爬樓梯",8]];
const ACTS=[[1.2,"大多坐著（上班、上課）"],[1.375,"常走動（站著工作、通勤走路）"],[1.55,"勞力工作（整天走動、搬東西）"]];

/* ---------- 狀態 ---------- */
const KEY="diet-diary-v1";
const blank=()=>({setup:false,profile:{sex:"f",age:30,h:160,w:60,goalW:55,goal:"lose",pace:2,act:1.2,coach:"roast"},days:{},myFoods:[],weights:[],updatedAt:0});
function fix(o){const b=blank();o.profile=Object.assign(b.profile,o.profile||{});if(!o.days||typeof o.days!=="object")o.days={};if(!Array.isArray(o.myFoods))o.myFoods=[];if(!Array.isArray(o.weights))o.weights=[];return o}
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=fix(Object.assign(blank(),JSON.parse(raw)))}catch(e){}
let tab="today",date=today(),addMeal=guessMeal(),exPick=0;
const $=s=>document.querySelector(s);
function pad(n){return String(n).padStart(2,"0")}
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function shift(ds,n){const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function r1(x){return Math.round((+x||0)*10)/10}
function guessMeal(){const h=new Date().getHours();return h<10?"b":h<15?"l":h<17?"s":h<21?"d":"s"}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2200)}
function day(d){return S.days[d]||(S.days[d]={food:[],ex:[]})}
function peek(d){return S.days[d]||{food:[],ex:[]}}

/* ---------- 儲存 / 雲端同步 ---------- */
let ref=null,wTimer=null,writing=false,again=false;
function prune(){const cut=shift(today(),-180),ic=shift(today(),-14);Object.keys(S.days).forEach(k=>{if(k<cut)delete S.days[k];else if(k<ic)(S.days[k].food||[]).forEach(x=>{delete x.img})});if(S.weights.length>400)S.weights=S.weights.slice(-400)}
function save(){S.updatedAt=Date.now();prune();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(ref){clearTimeout(wTimer);wTimer=setTimeout(flush,1200)}}
async function flush(){if(!ref)return;if(writing){again=true;return}writing=true;
  try{await ref.set(JSON.parse(JSON.stringify(S)))}catch(e){if(e&&e.code==="quota_exceeded")toast("雲端空間滿了，資料先存在這台裝置");else if(e&&(e.code==="invalid_argument"||e.code==="revoked")){ref=null;setSync(false)}}
  writing=false;if(again){again=false;flush()}}
function setSync(on){const el=$("#sync");el.className=on?"cloud":"";el.querySelector("span").textContent=on?"已雲端同步":"本機儲存"}
(async function(){try{
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const r=db.doc("data/users/"+id+"/diet");
  const snap=await Promise.race([r.get(),new Promise((_,rej)=>setTimeout(()=>rej("timeout"),10000))]);
  ref=r;setSync(true);
  if(snap.exists){const rem=snap.data()||{};
    if((rem.updatedAt||0)>(S.updatedAt||0)){S=fix(Object.assign(blank(),JSON.parse(JSON.stringify(rem))));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
    else if((S.updatedAt||0)>(rem.updatedAt||0))flush();
  }else if(S.updatedAt)flush();
}catch(e){}})();

/* ---------- 計算 ---------- */
function targets(){const p=S.profile;
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==="m"?5:-161);const tdee=bmr*p.act;
  const cut=p.goal==="lose"||p.goal==="recomp";const delta=p.goal==="lose"?-[275,550,825][p.pace-1]:p.goal==="recomp"?-[150,250,350][p.pace-1]:p.goal==="gain"?[150,300,450][p.pace-1]:0;
  const floor=p.sex==="m"?1500:1200;let kcal=tdee+delta,floored=false;
  if(cut&&kcal<floor){kcal=floor;floored=true}
  kcal=Math.round(kcal/10)*10;
  const pr=Math.round(p.w*PROT[p.goal]);
  const fat=Math.round(kcal*0.25/9);const carb=Math.max(0,Math.round((kcal-pr*4-fat*9)/4));
  const weekly=(kcal-tdee)*7/7700;
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,floored,weekly,
    t:{k:kcal,p:pr,c:carb,f:fat,fb:Math.max(20,Math.round(kcal/1000*14)),na:2400,su:Math.round(kcal*0.1/4)}};}
function totals(L){const o={k:0,p:0,c:0,f:0,fb:0,na:0,su:0};L.forEach(x=>N.forEach(([k])=>o[k]+=(+x[k]||0)));return o}
function exKcal(d){return peek(d).ex.reduce((a,x)=>a+(+x.k||0),0)}
function budget(d){const T=targets();const e=exKcal(d);return {k:T.kcal+e,ex:e,T}}
function verdict(d){const L=peek(d).food;if(!L.length)return {cls:"",t:"還沒記錄"};

   +'<text x="59" y="58" text-anchor="middle" font-size="24">'+Math.abs(left)+'</text><text class="s" x="59" y="78" text-anchor="middle" font-size="11">'+(over?"超過 kcal":"還可吃 kcal")+'</text></svg>';}

function barChart(R){const Wd=340,Ht=150,pl=8,pb=20,pt=8;const mx=Math.max(...R.map(r=>Math.max(r.k,r.b)),1)*1.1;const bw=(Wd-pl*2)/R.length;const Y=v=>pt+(1-v/mx)*(Ht-pt-pb);
  return '<svg class="chart" viewBox="0 0 '+Wd+' '+Ht+'" width="100%" role="img" aria-label="近 7 天攝取熱量">'+R.map((r,i)=>{const x=pl+i*bw;const over=r.k>r.b*1.05&&S.profile.goal!=="gain";
    return '<rect x="'+(x+bw*0.2)+'" y="'+Y(r.k)+'" width="'+(bw*0.6)+'" height="'+(Ht-pb-Y(r.k))+'" rx="4" fill="'+(over?"var(--bad)":"var(--accent)")+'"><title>'+r.d+'：'+r.k+' / '+r.b+' kcal</title></rect>'
     +'<line x1="'+(x+bw*0.1)+'" x2="'+(x+bw*0.9)+'" y1="'+Y(r.b)+'" y2="'+Y(r.b)+'" stroke="var(--peach)" stroke-width="2.5" stroke-linecap="round"/>'
     +'<text x="'+(x+bw/2)+'" y="'+(Ht-5)+'" text-anchor="middle">'+r.d.slice(5).replace("-","/")+'</text>'}).join("")+'</svg>';}
function wChart(P,goal){if(P.length<2)return '<div class="muted">記錄 2 筆以上就會畫出曲線。</div>';
  const Wd=340,Ht=160,pl=34,pr=10,pt=10,pb=22;const t0=new Date(P[0].d+"T12:00:00").getTime(),t1=new Date(P[P.length-1].d+"T12:00:00").getTime();
  let lo=Math.min(goal,...P.map(p=>p.w)),hi=Math.max(goal,...P.map(p=>p.w));lo=Math.floor(lo-0.5);hi=Math.ceil(hi+0.5);
  const X=d=>pl+((new Date(d+"T12:00:00").getTime()-t0)/Math.max(1,t1-t0))*(Wd-pl-pr),Y=w=>pt+(1-(w-lo)/(hi-lo))*(Ht-pt-pb);
  let g="";for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+='<line x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(pl-5)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+r1(v)+'</text>'}
  const pts=P.map(p=>X(p.d).toFixed(1)+","+Y(p.w).toFixed(1)).join(" ");const lp=P[P.length-1];
  return '<svg class="chart" viewBox="0 0 '+Wd+' '+Ht+'" width="100%" role="img" aria-label="體重曲線">'+g
   +'<line x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+Y(goal)+'" y2="'+Y(goal)+'" stroke="var(--peach)" stroke-width="2" stroke-dasharray="5 4"/><text x="'+(Wd-pr)+'" y="'+(Y(goal)-4)+'" text-anchor="end">目標 '+goal+'</text>'
   +'<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="'+X(lp.d)+'" cy="'+Y(lp.w)+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'
   +'<text x="'+pl+'" y="'+(Ht-6)+'">'+P[0].d.slice(5)+'</text><text x="'+(Wd-pr)+'" y="'+(Ht-6)+'" text-anchor="end">'+lp.d.slice(5)+'</text></svg>';}

   +'<div class="eq">'+N.slice(2).map(([k,n,u])=>'<span>'+n+((k==="na"||k==="su")?"（上限）":"")+'</span><b>'+T[k]+' '+u+'</b>').join("")+'</div>'
   +'<div class="eq" style="border-top:1px solid var(--line);padding-top:8px">'+MEALS.map(([m,n,r])=>'<span>'+n+'（'+Math.round(r*100)+'%）</span><b>'+Math.round(T.k*r/10)*10+' kcal</b>').join("")+'</div>'
   +(eta?'<div class="sug">'+eta+'</div>':'')+(R.floored?'<div class="sug">為了健康，每日熱量不會低於 '+R.kcal+' kcal（吃太少容易掉肌肉、代謝變慢），所以減重速度會比選的慢一點。</div>':'')
   +'<details><summary>這些數字怎麼算的？</summary><div class="muted" style="margin-top:6px">基礎代謝 BMR（Mifflin 公式）= '+R.bmr+' kcal，是躺著不動一天消耗的熱量。乘上活動量 = 每日總消耗 '+R.tdee+' kcal。'
   +(p.goal==="lose"?"減脂：每天少吃一些，每少 7700 kcal 約減 1 kg 脂肪。":p.goal==="recomp"?"增肌減脂：只少吃一點點，蛋白質吃很多，一定要配合重訓，否則只會變成慢慢減脂。":p.goal==="gain"?"增肌：每天多吃一點，配合重訓。":"維持：吃跟消耗一樣多。")
   +'<br>蛋白質 = 體重 × '+PROT[p.goal]+' g（減脂時吃夠蛋白質才不會掉肌肉）；脂肪佔熱量 25%；剩下給碳水。纖維每 1000 kcal 約 14 g；鈉上限 2400 mg（衛福部建議）；糖指的是添加糖，上限為熱量的 10%，水果和牛奶的天然糖不用太擔心。</div></details></div>';
  if(!viaClaude){const k=gKey(),rc=relayOn()&&rCode();h+='<div class="card"><h3>🤖 AI 拍照功能</h3>'
    +(rc?'<div class="muted">已開啟 ✓（使用邀請碼）'+(GT.msg?'<br>'+esc(GT.msg):'')+'</div><div class="row"><button class="btn sm" data-act="rtest" '+(GT.busy?"disabled":"")+'>'+(GT.busy?"測試中…":"測試連線")+'</button><button class="btn sm ghost danger" data-act="rdel">移除邀請碼</button></div>'
     :(relayOn()?'<div class="muted">輸入朋友給你的邀請碼，就能拍照算營養、讓教練用 AI 吐槽。</div><div class="row" style="flex-wrap:nowrap"><input id="rIn" autocomplete="off" placeholder="邀請碼" aria-label="邀請碼"><button class="btn pri" style="white-space:nowrap" data-act="rsave">開啟</button></div>'+(GT.msg&&!k?'<div class="sug">'+esc(GT.msg)+'</div>':'')+'<details><summary>或用自己的 Gemini 金鑰</summary><div style="margin-top:8px">':'')
    +(k?'<div class="muted">已開啟 ✓（'+(gFromVocab()?'沿用單字填空機的金鑰，':'')+'金鑰結尾 …'+esc(k.slice(-4))+'）'+(GT.msg?'<br>'+esc(GT.msg):'')+'</div><div class="row"><button class="btn sm" data-act="gtest" '+(GT.busy?"disabled":"")+'>'+(GT.busy?"測試中…":"測試連線")+'</button><button class="btn sm ghost danger" data-act="gdel">停用 AI</button></div>'
       :'<div class="muted">貼上 Google Gemini 的免費 API 金鑰，就能拍照算營養、讓教練用 AI 吐槽。金鑰只存在這支手機裡。</div><label class="f" for="gIn">Gemini API 金鑰<input id="gIn" type="password" autocomplete="off" placeholder="AIza 開頭的一串字"></label><button class="btn pri full" data-act="gsave">儲存並測試</button>'
         +(GT.msg?'<div class="sug">'+esc(GT.msg)+'</div>':'')
         +'<details><summary>怎麼拿到金鑰？</summary><div class="muted" style="margin-top:6px">1. 用電腦或手機打開 aistudio.google.com，登入 Google 帳號<br>2. 點「Get API key」→「Create API key」<br>3. 按複製，回來貼在上面<br>免費版每天有次數上限，用完隔天會恢復。不要把金鑰傳到群組或公開的地方。</div></details>')
    +(relayOn()?'</div></details>':''))
    +'</div>'}
  h+='<div class="card"><h3>資料</h3><div class="muted">'+(ref?"已自動存到雲端，換手機也看得到。":"資料存在這支手機的瀏覽器裡。換手機或清除瀏覽器資料前，先按「複製備份」把文字存到記事本。")+'</div><div class="row"><button class="btn sm" data-act="copy">複製備份</button><button class="btn sm ghost danger" data-act="reset">清除全部資料</button></div>'
   +'<details><summary>從備份還原</summary><textarea id="rsT" rows="4" style="width:100%;margin-top:8px;font:inherit;font-size:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px" placeholder="貼上備份文字"></textarea><button class="btn full" data-act="restore" style="margin-top:6px">還原</button></details></div>';
  return h;}

/* ---------- 互動 ---------- */
function addFood(o){day(date).food.push(Object.assign({m:addMeal},o));save()}
function keepForm(fn){const keep={};document.querySelectorAll("main input,main select").forEach(el=>{if(el.id)keep[el.id]=el.value});fn();render();Object.keys(keep).forEach(id=>{const el=document.getElementById(id);if(el&&el.type!=="file")el.value=keep[id]})}
function afterAdd(){setCoach(date,coachRule(addMeal,date),addMeal)}
function exCalc(){const m=+($("#exM")&&$("#exM").value)||0;return Math.round(SPORTS[exPick][1]*curW()*m/60)}
function phSum(){const el=$("#phSum");if(!el||!PH.res)return;const t=totals(PH.res.items.filter(x=>x.on));el.textContent=Math.round(t.k)+" kcal · 蛋白 "+r1(t.p)+" g"}
function confirmInline(b,msg){if(b.dataset.armed)return true;b.dataset.armed="1";const o=b.textContent;b.textContent=msg;setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=o}},3000);return false}
document.addEventListener("click",async function(ev){const b=ev.target.closest("[data-tab],[data-act]");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return}
  const a=b.dataset.act;
  if(a==="dd"){const n=shift(date,+b.dataset.n);if(n<=today()){date=n;wk=null;render()}}
  else if(a==="pick"){date=b.dataset.d;leftIdx=-1;CH.log=[];render()}
  else if(a==="wk"){wk=shift(wk||weekStart(date),+b.dataset.n);render()}
  else if(a==="left"){leftIdx=leftIdx===+b.dataset.i?-1:+b.dataset.i;render()}
  else if(a==="leftp"){const x=day(date).food[+b.dataset.i],p=+b.dataset.p;if(!x.o){x.o={};N.forEach(([k])=>x.o[k]=+x[k]||0)}N.forEach(([k])=>x[k]=k==="k"||k==="na"?Math.round(x.o[k]*p/100):r1(x.o[k]*p/100));x.pct=p;leftIdx=-1;save();render();toast(p===100?"已改回全部吃完":"已改成吃了 "+p+"%")}
  else if(a==="chat"){talkBack()}
  else if(a==="gsave"){const v=($("#gIn").value||"").trim();if(v.length<20){toast("請貼上完整的金鑰");return}try{localStorage.setItem(GKEY,v)}catch(e){toast("這個瀏覽器沒辦法存金鑰");return}useGemini();gTest()}
  else if(a==="gtest"){gTest()}
  else if(a==="rsave"){const v=($("#rIn").value||"").trim();if(!v){toast("請輸入邀請碼");return}try{localStorage.setItem(RCODE,v)}catch(e){toast("這個瀏覽器沒辦法存");return}useGemini();rTest()}
  else if(a==="rtest"){rTest()}
  else if(a==="rdel"){if(!confirmInline(b,"再按一次移除"))return;try{localStorage.removeItem(RCODE)}catch(e){}GT.msg="";useGemini();render();toast("已移除邀請碼")}
  else if(a==="gdel"){if(!confirmInline(b,"再按一次移除"))return;try{localStorage.setItem(GKEY,"none");localStorage.removeItem(GMOD)}catch(e){}GT.msg="";useGemini();render();toast("已停用 AI（單字填空機的金鑰不受影響）")}
  else if(a==="coach"){keepForm(()=>{S.profile.coach=b.dataset.c;save()})}
  else if(a==="goadd"){addMeal=b.dataset.m;tab="add";render();window.scrollTo(0,0)}
  else if(a==="meal"){addMeal=b.dataset.m;render()}
  else if(a==="delfood"){day(date).food.splice(+b.dataset.i,1);leftIdx=-1;save();render()}
  else if(a==="delex"){day(date).ex.splice(+b.dataset.i,1);save();render()}
  else if(a==="qf"){const all=S.myFoods.concat(FOODS.map(x=>({n:x[0],k:x[1],p:x[2],c:x[3],f:x[4],fb:x[5],na:x[6],su:x[7]})));const f=all[+b.dataset.i];addFood({n:f.n,k:f.k,p:f.p,c:f.c,f:f.f,fb:f.fb,na:f.na,su:f.su});afterAdd();toast("已加入"+MEALN[addMeal]+"："+f.n)}
  else if(a==="addcf"){const o={n:$("#cfN").value.trim()||"自訂食物"};N.forEach(([k])=>o[k]=Math.max(0,r1($("#cf_"+k).value)));if(!o.k&&!o.p&&!o.c){toast("請至少填熱量");return}
    const mf=MF.file;if(mf){o.img=await thumbOf(mf);try{URL.revokeObjectURL(MF.url)}catch(e){}MF.file=null;MF.url=""}
    addFood(o);afterAdd();if($("#cfS").checked&&!S.myFoods.some(f=>f.n===o.n)){S.myFoods.unshift(Object.assign({},o));save()}render();toast("已加入"+MEALN[addMeal]+"："+o.n)}
  else if(a==="phGo")analyze();
  else if(a==="phAdd"){const on=PH.res.items.filter(x=>x.on);if(!on.length){toast("請至少勾一樣");return}
    const th=await thumbOf(PH.file);on.forEach((x,j)=>{const o={n:x.n};N.forEach(([k])=>o[k]=Math.max(0,r1(x[k])));if(j===0&&th)o.img=th;addFood(o)});
    setCoach(date,PH.res.comment&&S.profile.coach!=="off"?PH.res.comment:coachRule(addMeal,date),addMeal);
    try{URL.revokeObjectURL(PH.url)}catch(e){}Object.assign(PH,{file:null,url:"",res:null,err:"",note:""});tab="today";render();window.scrollTo(0,0);toast("已加入 "+on.length+" 樣食物")}
  else if(a==="addex"){const m=+$("#exM").value||0;if(m<=0||m>600){toast("請輸入運動幾分鐘");return}const kk=exCalc();day(date).ex.push({n:SPORTS[exPick][0],min:m,k:kk});save();render();toast("已加入，多了 "+kk+" kcal 可吃")}
  else if(a==="addex2"){const k=Math.round(+$("#exK2").value||0);if(k<=0||k>3000){toast("請輸入消耗的熱量");return}day(date).ex.push({n:$("#exN2").value.trim()||"運動",min:0,k});save();render();toast("已加入")}
  else if(a==="goal"){keepForm(()=>{S.profile.goal=b.dataset.g;save()})}
  else if(a==="pace"){keepForm(()=>{S.profile.pace=+b.dataset.p;save()})}
  else if(a==="saveP"){const p=S.profile;const num=(id,lo,hi,d)=>{const v=+$(id).value;return v>=lo&&v<=hi?v:d};
    p.sex=$("#pSex").value;p.age=num("#pAge",12,100,p.age);p.h=num("#pH",120,230,p.h);const nw=num("#pW",30,250,p.w);
    if(nw!==p.w){p.w=nw;const d=today();S.weights=S.weights.filter(x=>x.d!==d);S.weights.push({d,w:nw})}
    p.goalW=num("#pG",30,250,p.goalW);p.act=+$("#pAct").value;S.setup=true;save();render();toast("每天目標 "+targets().kcal+" kcal")}
  else if(a==="addbw"){const w=r1($("#bwIn").value);if(!w||w<30||w>250){toast("請輸入正確的體重");return}const d=today();S.weights=S.weights.filter(x=>x.d!==d);S.weights.push({d,w});S.profile.w=w;save();render();toast("已記錄 "+w+" kg")}
  else if(a==="delbw"){S.weights=S.weights.filter(x=>x.d!==b.dataset.d);save();render()}
  else if(a==="copy"){try{navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast("已複製備份"),()=>toast("無法複製"))}catch(e){toast("無法複製")}}
  else if(a==="restore"){try{const o=JSON.parse($("#rsT").value);if(!o||typeof o!=="object"||!o.profile)throw 0;S=fix(Object.assign(blank(),o));save();render();toast("已還原")}catch(e){toast("備份文字不正確")}}
  else if(a==="reset"){if(!confirmInline(b,"再按一次確定清除"))return;S=blank();save();render();toast("已清除")}
});
document.addEventListener("change",function(ev){const t=ev.target;
  if(t.id==="mfIn"&&t.files&&t.files[0]){try{if(MF.url)URL.revokeObjectURL(MF.url)}catch(e){}MF.file=t.files[0];MF.url=URL.createObjectURL(MF.file);const keep={};document.querySelectorAll("[id^=cf]").forEach(el=>keep[el.id]=el.type==="checkbox"?el.checked:el.value);render();Object.keys(keep).forEach(id=>{const el=document.getElementById(id);if(el){if(el.type==="checkbox")el.checked=keep[id];else el.value=keep[id]}})}
  else if(t.id==="phIn"&&t.files&&t.files[0]){try{if(PH.url)URL.revokeObjectURL(PH.url)}catch(e){}PH.file=t.files[0];PH.url=URL.createObjectURL(PH.file);PH.res=null;PH.err="";render()}
  else if(t.id==="exS"){exPick=+t.value;const k=$("#exK");if(k)k.textContent=$("#exM").value?exCalc()+" kcal":"—"}
  else if(t.dataset&&t.dataset.ph==="on"&&PH.res){PH.res.items[+t.dataset.i].on=t.checked;t.closest(".item").classList.toggle("off",!t.checked);phSum()}});
document.addEventListener("keydown",function(ev){if(ev.target.id==="chIn"&&ev.key==="Enter"&&!ev.isComposing){ev.preventDefault();talkBack()}});
document.addEventListener("input",function(ev){const t=ev.target;
  if(t.id==="phNote"){PH.note=t.value;return}
  if(t.id==="exM"){$("#exK").textContent=t.value?exCalc()+" kcal":"—";return}
  if(t.dataset.ph&&t.dataset.ph!=="on"&&PH.res){PH.res.items[+t.dataset.i][t.dataset.ph]=t.value.replace(/[^\d.]/g,"");phSum()}});
const _r=render;render=function(){_r();phSum();const n=streak();$("#streak").textContent=n?"🔥 "+n+" 天":""};
render();
})();
</script>
</body>
